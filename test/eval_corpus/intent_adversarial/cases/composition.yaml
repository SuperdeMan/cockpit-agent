schema_version: 1
# A4 多意图组合：并行、串行依赖、adaptive、换序、取消其中一项。
#
# 这一类是「落域准确 ≠ 智能」的主战场：单看域全对、组合不完整照样答不上来
# （2026-08-02 验收报告 §2.4：goal 说推荐而 steps 无推荐步＝可检测的缺口信号）。
# 所以这里只用 required_intent_groups 的**全量满足**判定，不看 goal。
#
# 依赖断言默认只要求「consumer 依赖 producer」这条边；只有 manifest 里槽位名明确的
# 才写 carries——把猜的槽位名写进 gold，红灯说明的就不是产品缺陷了。
cases:
  # ── 并行换序（clause_commute）────────────────────────────────────────────
  - id: cp.weather-music.base
    title: 查天气再放首歌
    family_id: cp.weather-music
    cohort: unseen_transfer
    risk: medium
    status: stable
    tags: {attacks: [A4], mechanisms: [composition, parallel], domains: [info, media], layers: [l1], gate_candidate: true}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-02, evidence_report: "docs/reviews/eval/_ci-run-intent-adversarial{-l0,,-l2}.json + _ci-run-intent-gate-candidates{-l0,,-l2}-r2.json"}
    turns:
      - input: {utterance: 查一下今天天气，再放首歌, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [info.weather]}, {any_of: [media.play]}], allow_extra_intents: false}
  - id: cp.weather-music.swapped
    title: 放首歌再查天气（换序）
    family_id: cp.weather-music
    cohort: unseen_transfer
    risk: medium
    status: stable
    tags: {attacks: [A4], mechanisms: [composition, parallel, commute], domains: [info, media], layers: [l1], gate_candidate: true}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-02, evidence_report: "docs/reviews/eval/_ci-run-intent-adversarial{-l0,,-l2}.json + _ci-run-intent-gate-candidates{-l0,,-l2}-r2.json"}
    # info.weather 同时消费 date 槽与 raw_text；「今天」、当日绝对日期、缺省但原话含
    # 「今天」三种形态在能力侧归一为同一天。本关系只主张换序不改落域，不比较等价表示。
    relation: {base_case: cp.weather-music.base, type: clause_commute, expectation: {slot_policy: route_only}}
    turns:
      - input: {utterance: 放首歌，再查一下今天天气, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [info.weather]}, {any_of: [media.play]}], allow_extra_intents: false}
