name: negation-and-deferral
type: policy
description: 否定与延缓语义的规划纪律（先别/别/不要/暂时不用——被否定的动作一个 step 都不出）
priority: 85
# 依据：意图落域对抗测试首轮 §2 簇 A（docs/design/2026-08-02-intent-routing-adversarial-findings.md）。
# 四条里三条落在车控/门锁/写操作上，而且失败方向是**朝着执行去的**——「别做 X」被读成「做 X」。
# 归 policy 不归 guide：否定是跨域语义，hvac / door_lock / scene / reminder / parking 全部命中，
# 挂不到任何单个领域上。⚠ 它仍是**软层**——确认/权限/VAL 的硬闸不因为有了这条 policy 而放松。
# ⚠ policy 是**常驻**注入：每一次规划都付它的字符成本，且会挤占 guide 的预算额度
#   （首版 506 字符实测把 navigation-with-stop 挤成 !clipped）。改这段务必先数字数。
knowledge: |
  == 否定与延缓（跨域）==
  - 『别/先别/不要/不用/暂时不 X』：**X 与 X 的反面都不出 step**；无其他诉求只回复。
  - 肯定与否定并存：**只保留肯定部分**，被否定或延缓的动作一步都不出。
  - 尚未执行的动作被取消时，不得把「别播放」改写成 pause/stop/close；只有明确说动作正在进行并要求停止，才生成停止类 step。
few_shots:
  # 等价改写，刻意不复制 nq.hvac.keep-volume 的原句，保护 unseen_transfer 身份。
  - user: 空调别动，声音小点
    plan: {"steps":[{"id":"s1","agent_id":"edge-vehicle","intent":"volume.dec","slots":{},"depends_on":[],"slot_refs":{}}]}
golden:
  # 这里用的都是**语料之外**的说法：把对抗语料的原句写进 golden，等于把 unseen 案例
  # 洗成 seen，之后"通过率涨了"就再也读不出泛化了（findings §4.3-2）。
  - text: 空调先别关了
    expect_intents: [chitchat.talk]
    expect_not: [hvac.off, hvac.on]
  - text: 后备箱暂时不用开
    expect_intents: [chitchat.talk]
    expect_not: [trunk.open, trunk.close]
    holdout: true
  - text: 空调保持现在这样，声音小一点
    expect_intents: [volume.dec]
    expect_not: [hvac.off, hvac.on]
  - text: 查下天气，音乐先别放
    expect_intents: [info.weather]
    expect_not: [media.play, media.pause]
  - text: 音乐已经在放了，帮我暂停一下
    expect_intents: [media.pause]
    expect_not: [media.play]
owner: orchestrator
version: 1
