    tags: {attacks: [A7], mechanisms: [skill_recall], domains: [info, nearby], layers: [l0, l1], gate_candidate: true}
    provenance: {kind: real_badcase, source_ref: skills/guides/weather-outing.yaml, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-02, evidence_report: "docs/reviews/eval/_ci-run-intent-adversarial{-l0,,-l2}.json + _ci-run-intent-gate-candidates{-l0,,-l2}-r2.json"}
