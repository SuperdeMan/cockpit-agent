      store_latitude: store.data.items.0.lat
  source: trace
  added: '2026-08-13'
  tags:
  - badcase
  note: demo-mkemhn b69a16d9——指名门店要菜单不许打回「请先查询附近」（说法换店名防语料原句变 seen）
- text: 换一家瑞幸门店，还是点埃塞瑰夏冷萃
  plan:
  - id: store
    agent: nearby
