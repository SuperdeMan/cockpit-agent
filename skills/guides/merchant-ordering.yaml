name: merchant-ordering
type: guide
description: 麦当劳与瑞幸真实商户下单分流和门店接线判据（品牌下单、营养、查单、取消、附近门店与 demo 商户）
priority: 60
capability_dependencies:
  - nearby.search
  - mcd.menu
  - mcd.nutrition
  - mcd.order
  - mcd.order_status
  - luckin.menu
  - luckin.order
  - luckin.order_status
  - luckin.order_cancel
  - shop.order
keywords: [麦当劳, 瑞幸, 麦当劳点, 麦当劳下单, 瑞幸点, 瑞幸下单, 瑞幸取消, 生椰拿铁, 巨无霸套餐, 菜单, 热量]
knowledge: |
  - 麦当劳：下单→`mcd.order`；菜单→`mcd.menu`；热量→`mcd.nutrition`；
    查单→`mcd.order_status`。品牌单禁 `shop.order`。
  - 瑞幸：菜单→`luckin.menu`；下单→`luckin.order`；查单→`luckin.order_status`；
    取消→`luckin.order_cancel`。创建/取消不互代。
  - 「这家」按焦点定品牌；`shop.*` 仅演示商户。
  - 只问附近门店→`nearby.search`，禁下单。
  - 瑞幸无门店：`nearby.search`→`luckin.menu/order`，`depends_on` 前者，
    同一 `data.items.0` 取 `name/lng/lat`；禁填车机位置。
  - 点名门店「选择瑞幸门店：X」：瑞幸 `nearby.search(keyword=瑞幸咖啡 X)`；
    麦当劳 `store_hint=X`。

few_shots:
  - user: 生椰拿铁，找最近瑞幸，少冰半糖
    plan: {"complexity":"simple","steps":[{"id":"s1","agent_id":"nearby","intent":"nearby.search","slots":{"keyword":"瑞幸"},"depends_on":[],"slot_refs":{}},{"id":"s2","agent_id":"mcp-bridge","intent":"luckin.order","slots":{"item_query":"生椰拿铁","quantity":"1","ice":"少冰","sweetness":"半糖"},"depends_on":["s1"],"slot_refs":{"store_name":"s1.data.items.0.name","store_longitude":"s1.data.items.0.lng","store_latitude":"s1.data.items.0.lat"}}]}
  - user: 麦当劳国贸店两份麦香鱼套餐，打包
    plan: {"complexity":"simple","steps":[{"id":"s1","agent_id":"mcp-bridge","intent":"mcd.order","slots":{"item_query":"麦香鱼套餐","quantity":"2","store_hint":"国贸店","pickup_mode":"打包"},"depends_on":[],"slot_refs":{}}]}

plan_repairs:
  - kind: dependency_slot_ref
    trigger_any: [最近一家, 找最近的瑞幸, 找家近点的瑞幸, 就近, 附近的瑞幸, 离我近的瑞幸, 顺路选家门店, 点一杯瑞幸]
    producer_intent: nearby.search
    consumer_intent: luckin.order
    slot: store_name
    source_path: data.items.0.name
  - kind: dependency_slot_ref
    trigger_any: [最近一家, 找最近的瑞幸, 找家近点的瑞幸, 就近, 附近的瑞幸, 离我近的瑞幸, 顺路选家门店, 点一杯瑞幸]
    producer_intent: nearby.search
    consumer_intent: luckin.order
    slot: store_longitude
    source_path: data.items.0.lng
  - kind: dependency_slot_ref
    trigger_any: [最近一家, 找最近的瑞幸, 找家近点的瑞幸, 就近, 附近的瑞幸, 离我近的瑞幸, 顺路选家门店, 点一杯瑞幸]
    producer_intent: nearby.search
    consumer_intent: luckin.order
    slot: store_latitude
    source_path: data.items.0.lat

golden:
  - text: 麦当劳门店选国贸那家，给我来份双层吉士套餐
    expect_intents: [mcd.order]
    expect_not: [shop.order, mcd.menu, mcd.order_status]
  - text: 想喝瑞幸的厚乳拿铁，顺路选家门店帮我点一杯
    expect_intents: [nearby.search, luckin.order]
    expect_not: [shop.order, luckin.order_status]
    holdout: true
  - text: 麦当劳薯条的热量是多少
    expect_intents: [mcd.nutrition]
    expect_not: [mcd.order, mcd.menu]
  - text: 把刚才那笔瑞幸订单取消
    expect_intents: [luckin.order_cancel]
    expect_not: [luckin.order, luckin.order_status]
owner: mcp-bridge
version: 1
