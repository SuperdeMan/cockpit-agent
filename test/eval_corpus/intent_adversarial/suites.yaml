schema_version: 1
# 上限 520 而不是设计文档写的 500：设计 §9.4 明确「数字用于估算工作量，不替代覆盖
# 矩阵」。云侧 129 个 active intent 里逐个补齐 2 正例 + 2 硬负例 + 1 对照后落在 516 条，
# 为了压回 500 去删掉能证明边界的用例是本末倒置。落地记录里记了这笔偏差。
# 2026-08-02 再放到 540：同一条理由的第二次适用——泓舟新裁定了两条跨域边界
# （nearby-navigation.find-vs-go / manual-vision.described-light-vs-unknown-light），
# 台账契约要求每条**双向各 2 例**，机械地就是 +8。**边界裁定的对照用例是台账的兑现物，
# 不是可裁的冗余**；上限该跟着裁定数走，不是反过来。
# 2026-08-11 放到 560：同一条理由的第三次适用——真实商户 MCP 双域接入（麦当劳/瑞幸
# v1 只读激活，真机 tools/list 核实）带来 3 个新 active intent（正2/硬负2/对照1 +
# 各 1 条 relation invariant）与 2 条新边界裁定（luckin-shop 品牌 vs demo、
# mcd-nearby 品牌菜单 vs 周边发现；双向各 2 例=+8）。合计 +18 唯一输入（553），
# 全部是能力面实质扩张的兑现物。
# 2026-08-12 复合下单激活后再 +7：保留并翻转两条「未接入」原 case id，另补
# mcd.order / luckin.order 各一条独立正例和一条 relation 对照，luckin.order_cancel
# 补两条正例和一条 relation 对照。翻转不增输入，新增恰好 7，distinct_inputs=560；
# 没有删旧尺子压数字，现上界恰好用满。
suites:
  discovery:
    statuses: [candidate, reviewed, stable]
    live_statuses: [reviewed, stable]
    min_cases: 450
    max_cases: 560
    attack_minimums: {A1: 80, A2: 50, A3: 45, A4: 60, A5: 50, A6: 45, A7: 40, A8: 35, A9: 45}
    normal_repeats: 1
    failure_repeats: 3
    high_risk_repeats: 3
    independent_processes: 1
    independent_layers: []
  gate:
    statuses: [stable]
    live_statuses: [stable]
    min_cases: 120
    max_cases: 160
    attack_minimums: {}
    normal_repeats: 3
    failure_repeats: 3
    high_risk_repeats: 3
    independent_processes: 2
    independent_layers: [l1, l2]
