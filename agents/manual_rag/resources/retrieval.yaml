# 问法意图只补“要找哪类证据”（计排序覆盖率），不注入答案、不计零命中闸。报警/故障
# 问法不能被数值规格规则带偏。
#   drop_any：规则成立时从内容里去掉的主语词（「车身有多长」的「车身」指整车本身）；
#   standalone：内容剥空时证据本身就是问题（「这车有多长」），必须配 require_any。
intent_expansions:
  - when_any: [多少, 标准, 推荐, 合适, 参数]
    unless_any: [报警, 故障, 异常, 亮灯, 亮了, 充电, 充到]
    append: [参数]
  - when_any: [多久, 周期, 多长时间, 几年]
    require_any: [换, 更换]
    append: [时间, 里程, 更换]
  - when_any: [多久, 周期, 多长时间, 几年]
    require_any: [保养, 维护]
    append: [定期保养, 时间, 里程]
  # 整车规格：主语是整车时才补参数表证据；「座椅能调多高」这类部件问法不受影响。
  - when_any: [多长, 多宽, 多高, 尺寸, 长宽高, 车长, 车宽, 车高]
    require_any: [这车, 这辆车, 这台车, 车身, 整车, 车子, 车辆, 车有, 车多, 车长, 车宽, 车高]
    unless_any: [时间, 多久]
    append: [整车尺寸参数]
    drop_any: [车身, 整车, 车子, 车辆]
    standalone: true
  - when_any: [多重, 重量, 车重, 整备质量, 多少斤, 多少公斤]
    require_any: [这车, 这辆车, 这台车, 车身, 整车, 车子, 车辆, 车有, 车多, 车重, 整备]
    append: [质量参数]
    drop_any: [车身, 整车, 车子, 车辆]
    standalone: true
  - when_any: [续航]
    unless_any: [冬天, 冬季, 低温, 为什么, 下降, 影响, 变短, 缩水, 还剩, 剩余, 现在, 当前]
    append: [续航里程, 动力性参数]
  - when_any: [最高车速, 极速, 最快, 多快]
    unless_any: [充电, 充满]
    append: [动力性参数, 最高车速]
  - when_any: [电池容量, 几度电, 多少度电, 电池多大, 多少度, 总储电量]
    append: [动力电池参数, 总储电量]
  - when_any: [电池]
    require_any: [什么电池, 电池类型, 哪种电池, 电池是什么, 类型, 种类]
    append: [动力电池参数, 储能装置种类]
    standalone: true
  - when_any: [轮胎, 轮毂, 车轮, 轮辋]
    require_any: [尺寸, 多大, 规格, 型号, 大一号, 几寸]
    append: [车轮与轮胎参数, 规格]
    standalone: true
  # 属性问词本身指明要哪一维证据。
  - when_any: [多高]
    append: [高度]
  - when_any: [多长]
    unless_any: [时间, 多长时间]
    append: [长度]
  - when_any: [多宽]
    append: [宽度]
  - when_any: [多重]
    append: [重量, 质量]
  - when_any: [多远]
    append: [距离]
  - when_any: [多快]
    unless_any: [充电]
    append: [速度, 车速]
