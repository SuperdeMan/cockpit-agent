name: conditional-reminder
type: guide
description: 查询结果决定后续动作的条件句（如果/要是…就…，如下雨就提醒带伞、降温就提醒加衣）只规划查询步并标 adaptive
priority: 65
keywords: [如果, 要是, 的话, 就提醒, 下雨就, 提醒我带]
knowledge: |
  先判定「提醒是否依赖查询结果」，不要只凭同一句里同时出现『提醒』和『天气』就当条件句：
  - **条件**：『查X，如果/要是结果Y就提醒Z』，提醒做不做由查询结果决定。
  - **并列**：提醒本身已经有**明确时间**，再用『再/顺便/另外』查询天气；两件事都要做，
    reminder.create 与天气查询是两个独立步骤，不能把提醒吞掉。

  **条件依赖**（『查X，如果/要是…就Y』——后半件事做不做取决于前一步查询结果）必须选
  adaptive：先只规划查询步，看到结果再决定是否执行 Y；不要把 Y 无条件排进计划，
  也不要只查不管 Y。

  示例——用户：『查下明天会不会下雨，要是下雨就提醒我带伞』
  → 条件依赖：**只**规划查询步、标 adaptive（看到天气结果再决定要不要建提醒；
  绝不能直接建提醒去问"什么时候提醒"）：
  {"complexity":"adaptive","steps":[
  {"id":"s1","agent_id":"info","intent":"info.weather","slots":{"date":"明天"},"depends_on":[],"slot_refs":{}}
  ]}
golden:
  # expect_not 是这条知识的另一半：条件句首轮绝不能把提醒无条件排进计划；
  # expect_complexity 是核心主张本身——条件依赖必须 adaptive（看结果再决定）
  # 天气族容忍（同 multi-day 先例）：本知识的主张是「只出查询步+adaptive」，
  # weather/forecast 族内怎么选归 mode_routing 管——严格钉 weather 会把族内方差
  # 记成知识功劳（2026-07-27 消融车道实测）
  - text: 查下明天会不会下雨，要是下雨就提醒我带伞
    expect_intents: ["info.weather|info.forecast"]
    expect_not: [reminder.create]
    expect_complexity: adaptive
  # holdout：避开 knowledge 原句与全部 keywords 字面（测泛化不测自证）
  - text: 看下明晚会不会下雨，要下就叫我收衣服
    expect_intents: ["info.weather|info.forecast"]
    expect_not: [reminder.create]
    expect_complexity: adaptive
    holdout: true
  # M-A A1-3 真栈反例：明确八点的提醒不依赖天气，『再看下』是并列连接词。
  - text: 明天早上八点提醒我带伞，再看下明天深圳会不会下雨
    expect_intents: [reminder.create, "info.weather|info.forecast"]
owner: orchestrator
version: 2
