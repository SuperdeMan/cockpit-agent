  - id: ex.colloquial.hot
    title: 体感冷热应落到空调
    family_id: ex.colloquial-hot
    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A9], mechanisms: [colloquial], domains: [hvac], layers: [l1], gate_candidate: true}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02}
    turns:
      - input: {utterance: 有点热, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [hvac.dec, hvac.set, hvac.on]}], forbidden_intents: [chitchat.talk, window.open], allow_extra_intents: false}
