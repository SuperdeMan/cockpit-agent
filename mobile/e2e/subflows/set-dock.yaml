# 「承诺面 Focus Dock」前提：建立 → 回读（AR06 / A06-2）。
#
# 为什么要有它：02 验的是**气泡内**确认（v1 路径，Dock 关），06 验的是**承诺面**（Dock 开）
# ——两条前提互斥，一趟里不可能同时绿。以前两条流都不建立自己的前提、靠上一次测试的残留，
# 于是「02 红」既可能是回归、也可能只是上一趟把开关留成了开（2026-09-05 实证过一次误判）。
#
# 判据本体在 subflows/set-switch.yaml —— **这里只做参数绑定，不复制一份点开关的逻辑**。
#
# 入参：DOCK = "true" | "false"
appId: com.xiaozhou.companion
---
- runFlow:
    file: set-switch.yaml
    env:
      SWITCH_KEY: "uxV2Dock"
      SWITCH_ON: "${DOCK}"
