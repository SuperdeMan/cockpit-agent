schema_version: 1
# 覆盖补全：为覆盖矩阵里仍缺正例/硬负例/对照的**云侧全部 intent** 与**端侧危险动作**
# 补最小对照对。
#
# 为什么用 route_flip 对：一对同框架、只换对象的句子，能同时给两个 intent 各补一个
# 正例、一个硬负例和一次对照参与——比堆三条互不相关的单句既省条数又更能证明边界。
# 这不是「复制近义句冲条数」：每一对都是一条真实存在、且模型确实会混的边界。
cases:
