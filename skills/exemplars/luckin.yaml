# 范例库 · luckin 域（瑞幸官方 MCP，2026-08-11 真机核实激活）
# 契约 skills/exemplars/README.md；只追加不插入（eid=<domain>#序号）。
# luckin.order / order_status / order_cancel 已接通；无品牌咖啡仍归 demo 商户。
# 边界两条：带瑞幸品牌的下单话术归真实 workflow，
# 「附近的瑞幸」归 nearby.search——防单 intent 新域变成话术黑洞。
