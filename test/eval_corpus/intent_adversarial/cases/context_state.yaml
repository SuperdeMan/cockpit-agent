schema_version: 1
# A5 上下文污染：陈旧 history、focus、pending plan、topic switch、指代。
#
# 两种断言方向刻意都写：
# - `invariant`：**当前轮必须盖过陈旧历史**——同一句话，带不带无关旧话题，结果必须一样。
# - `context_override`：**上下文必须真的被消费**——同一句省略式追问，focus 不同结果必须不同。
#   只测前者会纵容「干脆不看上下文」，只测后者会纵容「被历史带跑」。
cases:
  # ── 陈旧历史不得改写当前轮（invariant）──────────────────────────────────
  - id: cs.weather.clean
    title: 裸问天气（无历史）
    family_id: cs.weather-stale
    cohort: seen_regression
    risk: medium
    status: stable
    tags: {attacks: [A5], mechanisms: [stale_history], domains: [info], layers: [l1], gate_candidate: true}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-02, evidence_report: "docs/reviews/eval/_ci-run-intent-adversarial{-l0,,-l2}.json + _ci-run-intent-gate-candidates{-l0,,-l2}-r2.json"}
    turns:
      - input: {utterance: 今天天气怎么样, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [info.weather]}], forbidden_intents: [nearby.search, nearby.detail], allow_extra_intents: false}
  - id: cs.weather.stale-restaurant
    title: 裸问天气（前面在聊餐厅）
    family_id: cs.weather-stale
    cohort: seen_regression
    risk: medium
    status: stable
    tags: {attacks: [A5], mechanisms: [stale_history], domains: [info], layers: [l1], gate_candidate: true}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-03, stabilized_via: evidence_only, evidence_report: "docs/reviews/eval/_ci-run-intent-gate-promotion-{a,b}.json"}
    relation: {base_case: cs.weather.clean, type: invariant, expectation: {}}
    turns:
      - input:
          utterance: 今天天气怎么样
          context:
            history: [{role: user, text: 附近有什么好吃的川菜}, {role: assistant, text: 为您找到 3 家川菜馆}]
        expected:
          plan: {required_intent_groups: [{any_of: [info.weather]}], forbidden_intents: [nearby.search, nearby.detail], allow_extra_intents: false}
