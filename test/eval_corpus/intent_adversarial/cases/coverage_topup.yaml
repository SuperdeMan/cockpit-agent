    family_id: tu.charging-plan-status
    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A2], mechanisms: [object_flip], domains: [charging], layers: [l1]}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02}
    turns:
      - input: {utterance: 我要开去长沙，帮我把路上补能安排好, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [charging.plan]}], forbidden_intents: [charging.status, charging.find], allow_extra_intents: false}
