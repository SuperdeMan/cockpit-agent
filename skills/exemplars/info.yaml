# 2026-08-02：对抗测试 ki.hint.no-hijack-sports「昨晚国安打成几比几」在 info.sports 与
# info.search 之间抖（unstable）。既有赛事范例全是**赛事专名**（世界杯/欧冠/英超/西甲），
# 没有一条是「中超球队 + 口语比分问法」——**这不是路由错，是说法没见过**，按 M5 分工投范例。
# 说法避开语料原句（原句用「打成几比几」，这里用「几比几赢的」）。
- text: 昨天国安几比几赢的
  plan:
  - agent: info
    intent: info.sports
  source: manual
  added: '2026-08-02'
  tags:
  - badcase
  note: 中超球队 + 口语比分问法，此前落 info.search
# ── 2026-08-04 补：过去时的**泛指**赛事问法 ─────────────────────────────────
# 立卡来源 nq.match.past（对抗语料 stable，A3 时态）：5 趟 live 只过 1 趟，其余落
# `info.search`，诊断行 `exemplars=[]`。既有 7 条赛事范例要么带**赛事专名**
# （世界杯/欧冠/英超/西甲），要么带**球队名**（国安）——**没有一条是「那场比赛」这种
# 泛指**。而泛指正是时态攻击的载体：句子里唯一的信息就是「昨天」+「比赛」。
# 说法避开语料原句（原句问「结果是多少」，这里问「谁赢了」）。
- text: 昨天那场球谁赢了
  plan:
  - agent: info
    intent: info.sports
  source: manual
  added: '2026-08-04'
  tags:
  - badcase
  note: 泛指 + 过去时，此前落 info.search
# 第一条泛指过去赛果已被注入仍有跨进程方差；再补一个不同时态/问法的非语料变体。
- text: 前天那场球赛最后谁拿下了
