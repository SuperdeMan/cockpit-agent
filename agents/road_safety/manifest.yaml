agent_id: road-safety
version: 0.1.0
display_name: 安全助手
category: core
trust_level: first_party
deployment: cloud
latency_budget_ms: 3000
fallback: chitchat

capabilities:
  - intent: safety.driving_advice
    # 2026-09-19（QA 交接页 §5「安全问句偶尔落 info.search」）：描述原来只有
    # 「综合天气+路况」一句。Agent 早在 C1-B（2026-08-26）就实现了「本轮原话带车辆告警 ⇒
    # 按告警等级确定性给出停车/降速结论」（`_spoken_alert` → `_alert_bound_advice`），
    # 但 planner **只看得见 manifest**——描述里一个字没提告警，于是「红色机油灯亮了还能继续
    # 开吗」被规划成 `info.search`（information T24，trace 9032bb7c…）：答案是对的、路径是
    # 错的（靠模型自己的知识与外网，无 provenance，也不是任何人设计的安全出口）。
    # 与 driver_state 那条同一个病：**改实现不等于加能力**。
    # 地盘划分（与 manual-rag 的 route_hints 对齐）：灯/图标**是什么意思、怎么办、怎么处理**
    # 归手册问答（说明书给含义与处置步骤）；告警之后**还能不能继续开、要不要停车、慢点开
    # 行不行**归本条——结论由 `runtime/safety_signal` 的等级确定，不联网、不看天气。
    description: 综合天气+路况给出驾驶安全建议；车辆告警（警示灯亮起/报警/异响/漏气等）之后
      「还能不能继续开、要不要停车、慢点开行不行」的处置判断也归本能力——结论按告警等级确定，
      不联网搜索。告警灯的含义与手册处置步骤归车型手册问答
    slots: [destination]
    # 2026-08-03：「路上怎么样」从这里移走。它一句也不体现**驾驶建议**这个角度，
    # 字面就是隔壁 `safety.road_condition`「查询路况」——两条 examples 只差一个字
    # （路上/路况）却指向不同 intent，**差的不是判据是一个词**，模型分不开、人也分不开。
    # 与下面那段注释是同一个病的第二例：examples 要写「只有本能力答得了」的说法。
    # 证据：对抗测试消融给出 `causal=supported`（`no-exemplars` 臂稳定翻正），
    # 镜像到 `skills/exemplars/safety.yaml` 的这条以 `@lex:1.00` 精确命中把
    # 「路上怎么样」拉到 driving_advice，而语料 gold 要 road_condition。
    examples: ["这会儿开车出门合适吗", "开车去上海安全吗", "今天适合开车吗",
               "机油灯亮了还能继续开吗", "水温报警了要不要停车"]
  # 2026-08-15（卡 Q9 / QA 轮 I-043）：**驾驶员状态**此前在能力面上完全不存在。
  # 后果不是「答得不好」，是**根本路由不过来**——「困到睁不开眼了，还要开两个小时」
  # 三次取样分别落到了闲聊、拒识和音量调节，而 Agent 里的确定性疲劳判据一次都没跑到。
  # 判据（本仓既有）：**改实现不等于加能力——planner 只看得见 manifest。**
  # examples 按「只有本能力答得了」写：这几句除了安全助手没有第二个域该接。
  - intent: safety.driver_state
    description: 驾驶员自身状态影响能否继续驾驶时的安全判断与处置建议
      （疲劳/困倦/饮酒或服药/身体不适）。**不是**天气路况建议，也不是闲聊安慰
    slots: []
    examples: ["困到睁不开眼了还要开两个小时", "刚喝了两杯酒还能开车吗",
               "有点犯困撑一下应该没事吧", "开着开着有点头晕"]
  # 2026-07-30 examples 判别化：原例句「有天气预警吗」「暴雨预警了吗」与 info.alerts 的
  # 「有没有天气预警」「北京有暴雨预警吗」**只差语气词**——描述是判别的（本条是「对驾驶的
  # 影响」），但例句一句也不体现驾驶角度，于是两个域在同一批说法上互相声称。这是与
  # nearby/navigation/charging 同一个病：**manifest examples 是「我这能力能答这句」写出来的，
  # 天然不判别化**；P1 把它们批量导入范例库当金标，冲突就被激活成了判定尺的自相矛盾。
  # 裁定：裸问预警本身归 info.alerts；带驾驶影响/上路注意归本条。
  - intent: safety.weather_alert
    description: 查询天气预警**对驾驶的影响**（能不能上路、路上要注意什么）；
      只问预警本身有没有、几级归 info.alerts
    slots: [city]
    examples: ["这天气预警影响开车吗", "有预警的话路上要注意什么"]
  - intent: safety.road_condition
    description: 查询路况（拥堵/事故/施工）
    slots: [route]
    examples: ["路况怎么样", "高速堵车吗"]

# SF3：继续驾驶/降速/靠边是安全问题，不是导航或音量控制。只声明本 Agent 自己的
# 窄语法，仍经通用 RouteHintEngine；设备/媒体词命中 guard 时完全不接管。
route_hints:
  - pattern: '^\s*(?:(?:(?:现在|目前)(?:在)?)?(?:高速|路上|行驶|驾驶)[^，。！？!?]{0,12}(?:(?:还能|能否|能不能|可以)?\s*(?:继续开|继续行驶|开车|驾驶))|(?:慢一点|慢点)\s*(?:开|行驶)|(?:这种情况|这种状态|这样|现在)?\s*(?:需要|要不要|是否需要)\s*(?:靠边(?:停车)?|停车))(?:可以)?[吗呢吧]?[。！？!?]?\s*$'
    intent: safety.driving_advice
    policy: replace
    priority: 126
    guard: '(?:视频|音乐|歌曲|游戏|软件|程序|空调|设备|手机|电脑)'
  # 2026-09-19（QA 交接页 §5，information T24）：「<车辆告警>（亮了/报警/异响…）还能不能继续开」
  # 的教科书形态——上面那条只认「高速/路上/行驶/驾驶」开头的续驾追问，告警本身在句首时不命中，
  # 于是这一句交给了模型、被规划成 `info.search`。canonical 形态不该靠温度采样，钉成 hint。
  # 三个形态分支：① 具名灯 + 亮/闪；② 具名灯 + 后文「继续/接着」（「胎压灯还能继续开吗」）；
  # ③ 告警现象词（报警/故障/异响/漏气/过热/失灵…）。「灯」单独出现时必须带 ①② 之一——
  # 「大灯还能开吗」的「开」是开灯不是开车。问句尾两种：「还能不能（继续）开」与「要不要 /
  # 需要（靠边）停车」。整句锚定（`^…$`）：带第二个诉求的复合句不接管。
  # guard 三组：非车辆设备（同上条）；**正常功能灯**（大灯/雾灯/日行灯/氛围灯/阅读灯/转向灯/
  # 刹车灯/尾灯/示宽灯/双闪——`runtime/safety_signal.py` 的纪律「宁可漏一个告警，也不要对着
  # 一盏正常的灯劝人停车」）；路口红绿灯语境。
  # 优先级 122 < manual-rag 的 124：手册已声明的形态（「胎压报警…还能开」「机油灯亮了怎么办」）
  # 仍归手册；本条只接手册没声明的续驾问句。
  # 词表对账：pattern 里的现象词与 `runtime.safety_signal.ALERT_VERBS` / `WARNING_LIGHTS`
  # 由 `orchestrator/cloud/tests/test_route_hints.py::test_alert_continuation_hint_covers_the_runtime_alert_vocabulary`
  # 逐词对账——那里改词表这里不跟，测试当场红。
  - pattern: '^\s*(?:[^，。！？!?]{0,12}?灯[^，。！？!?]{0,4}(?:亮|闪)(?:了|着|起|起来|烁)?[^，。！？!?]{0,6}|[^，。！？!?]{0,12}?灯[^，。！？!?]{0,6}(?=[^，。！？!?]{0,14}(?:继续|接着))|[^，。！？!?]{0,12}?(?:故障码|报警|警报|警告|警示|故障|异响|冒烟|起火|漏气|掉压|亏气|过热|失灵|打滑|抖动)(?:了|着|起来)?[^，。！？!?]{0,6})[，,、]?\s*(?:这样|这种情况|这种状态|现在|我|车子?)?(?:(?:还|仍然|仍)?\s*(?:能|能否|能不能|可以|可不可以|可否|是否能|是否可以|行不行|行吗)\s*(?:继续|接着)?\s*(?:开(?:车)?|行驶|驾驶|上路|开下去|往前开|开回去|开回家|开到)(?:一段|一会儿?|一下|一阵|到[^，。！？!?]{1,8}|回[^，。！？!?]{1,6})?|(?:需要|要不要|是否需要|该不该|该|要|得)\s*(?:马上|立刻|立即|先)?\s*(?:靠边(?:停车)?|停车|停下来|停下))(?:吗|呢|么|不|吧|嘛|呀)?[。！？!?]?\s*$'
    intent: safety.driving_advice
    policy: replace
    priority: 122
    guard: '(?:视频|音乐|歌曲|游戏|软件|程序|空调|设备|手机|电脑|大灯|远光|近光|雾灯|日行灯|氛围灯|阅读灯|转向灯|刹车灯|尾灯|示宽灯|双闪|路口|红绿灯|信号灯|交通灯|闯)'

requires_permissions: [location.read, network.external]
context_scopes: [location]   # 透传给子 agent（navigation）
