  # ── 只算不导 vs 真的动身（navigation.estimate，2026-08-19 卡 Q8 / I-016）──────
  # 与上面 driver-state 同一条判据的第二次适用：**补的不是「模型分不清」，
  # 是能力面上本来就没有左边那一侧**。在 estimate 之前，导航域只有
  # navigate_to 一个「跟这两点有关」的工具，于是「从A到B多远多久」被就近挑成导航
  # 并**真的开始导航**（真栈 --repeat 3：1/3 发出 navigate、答「全程约21公里」）。
  # 判据是**用户要的是数还是行程**。两侧都要锁：只锁左边会纵容把「导航去」也答成
  # 估算，那是把一个不可逆动作变成一句话，方向反了但一样错。
