agent_id: charging-planner
version: 0.1.0
display_name: 充能助手
category: core
trust_level: first_party
deployment: cloud
latency_budget_ms: 2000
fallback: chitchat

capabilities:
  # 判别化（2026-07-30 地盘收口）：**找充电桩一律归本条，不分「有没有电量语境」**。
  # 2026-07-19 周边发现重构曾把「纯发现（附近有没有充电站）」判给 nearby.search 出统一富卡，
  # 该判据本次作废——本条读真实 SOC（context_scopes: vehicle_state）、按**空闲优先**排序、
  # 支持目的地途经点，而 nearby 的评分/人均对充电桩毫无意义。M5 P2 双臂裸跑两档一致：
  # 摘掉 nearby 那条 replace 正则后，模型自己就落这里——是规则在 LLM 之后把对的踩成错的。
  - intent: charging.find
    description: 给车找充电站/充电桩（含「附近有充电桩吗」这类纯发现）——读车辆真实电量、
      按空闲状态与距离排序，可作为导航途经点；手机/耳机等随身设备充电不归此能力
    slots: [destination, soc, prefer]
    examples: ["找个充电站", "附近有充电桩吗", "快充在哪", "快没电了附近找个快充"]
  - intent: charging.plan
    description: 规划车辆长途充能策略（沿途分段充电）
    slots: [destination, soc, departure_time]
    heavy: true    # 长途充能沿途分段规划 → 开思考+过程区
    examples: ["去杭州怎么充电", "帮我规划充电"]
  - intent: charging.status
    description: 查询当前充电状态
    slots: []
    examples: ["现在电量多少", "还能跑多远"]

requires_permissions: [location.read, navigation.control, network.external]
context_scopes: [location, vehicle_state]   # 按位置找站 + 按真实电量规划

# 确定性路由（R2.1；2026-07-27 eval_skills live 采样方差实证）：「去X怎么充电」「快没电了
# 找桩」是本域教科书形态，LLM@0.3 温度下偶发翻面到 nearby/导航——canonical 形态按惯例
# hint 钉死；paraphrase 泛化（「补个电」「电够不够」）仍由 skill 知识层（charging-strategy
# guide）承担。guard 互斥：plan 形态不吃 find 的「附近/就近」，find 形态不吃 plan 的
# 「怎么充/长途」与导航动词。
route_hints:
  # 设备 guard 两条 hint 都要（2026-07-27 评审三批：「去露营手机怎么充电」「去露营怎么
  # 充电宝」会命中 plan 形态——SOC/充电词形对设备成立不分 plan/find）。
  # 【charging.plan 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 2 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '去([^，。！？]{1,12}?)(?:的路上)' 找回原块。
  # 【charging.find 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 4 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '(?:^(?:糟了|糟糕|哎呀|哎哟|完了|不好' 找回原块。
