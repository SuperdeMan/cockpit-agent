name: navigation-with-stop
type: guide
description: 导航去某地并顺路找停靠点，以及从上轮顺路候选中用序号选择途经点的连续规划
priority: 55
capability_dependencies: [navigation.navigate_to, nearby.search, nearby.detail, shop.menu, charging.find]
keywords: [导航, 顺路, 途经, 附近找, 找个吃, 吃饭的地方, 充电桩, 找个充电, 咖啡, 停一下, 第几个, 第一个, 第二个, 选第一家, 选第二家]
knowledge: |
  **先找候选、再去选中结果**：用户明确要求先搜索/比较，找到或选定后再带他过去，必须输出
  搜索 producer 与 navigation.navigate_to consumer 两步；导航步用 depends_on 指向搜索步，
  并用 slot_refs 把 `destination` 接到 `s1.data.items.0.name`，不能只做搜索。若用户已经给定
  目的地，只是同时找另一类设施，则不属于这条，仍按下文的并行/顺路规则处理。

  **导航去X + 顺路/在附近 找吃饭/餐厅/咖啡** → 用**单个** navigation.navigate_to
  （带 stop_category，它会导航并给真实候选让用户选途经点），**不要**再拆出
  nearby.search（nearby 仅用于纯发现/看详情/订位，不产生导航途经点；拆了会串味）。

  示例——用户：『导航去东方之门，然后在附近找个吃饭的地方』→ 只选一个
  导航到目的地能力，destination=东方之门、stop_category=吃饭。

  示例——用户：『导航去东方之门途经肯德基』（用户已选好途经点）→ 只选一个
  导航到目的地能力，destination=东方之门、waypoint=肯德基。

  **顺路候选后的序号续接**：如果最近对话焦点明确写着「最新候选用途=顺路途经点选择」，
  用户接着只说『第一个/第二个/选第二家』，这是在选择**途经点**，不是看 nearby.detail，
  也不是把候选店改成最终目的地。输出单个 navigation.navigate_to：destination 沿用焦点里的
  上个目的地，waypoint 取最新候选对应序号的完整名称。只有用户明确说『看详情/看菜单/点单』
  才追加相应能力；裸序号不要自行追加 nearby.detail 或 shop.menu。

  示例——用户：『导航去深圳湾，在附近找个充电桩』→ 选导航到目的地与充电找桩
  两个能力，无依赖并行；两步的 destination 都是深圳湾。
few_shots:
  - user: 上轮目的地是腾讯滨海大厦，顺路候选第二个是Something For；我选第二个
    plan: {"steps":[{"id":"s1","agent_id":"navigation","intent":"navigation.navigate_to","slots":{"destination":"腾讯滨海大厦","waypoint":"Something For"},"depends_on":[],"slot_refs":{}}]}
golden:
  - text: 导航去东方之门，附近找个吃饭的地方
    expect_intents: [navigation.navigate_to]
  - text: 导航去深圳湾，在附近找个充电桩
    expect_intents: [navigation.navigate_to, charging.find]
  # holdout：不与 knowledge 示例原句重合、避开全部 keywords 字面（测泛化不测自证）；
  # expect_not 是知识的另一半——不要再拆 nearby.search。
  # expect_ablation_effect：消融两轮实测 without→search_poi/nearby（唯一有跨 run
  # 因果证据的 holdout），预期知识增益应持续兑现（报告型，不 gate）
  - text: 送我去宝安机场，路上找地方吃个饭
    expect_intents: [navigation.navigate_to]
    expect_not: [nearby.search]
    holdout: true
    expect_ablation_effect: true
  - text: 先查附近评分最高的书店，找到后带我去
    expect_intents: ["nearby.search|navigation.search_poi", navigation.navigate_to]
    holdout: true
owner: navigation
version: 3
