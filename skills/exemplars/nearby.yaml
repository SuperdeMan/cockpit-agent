# 2026-07-30 地盘收口：这条原在 navigation.yaml（source=manifest 带过来的过期声明），
# 双臂裸跑两档一致落 nearby——餐饮发现是本域地盘，navigation 的声明才是错标。
- text: 找个评分高的川菜馆
  plan:
  - agent: nearby
    intent: nearby.search
  source: manifest
  added: '2026-07-30'
  tags:
  - canonical
  note: 原标 navigation.search_poi，2026-07-30 改判
- text: 找一家附近评分最高的川菜馆，直接导航过去
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      category: 餐饮
      cuisine: 川菜
      sort: rating
  - agent: navigation
    intent: navigation.navigate_to
  source: trace
  added: '2026-07-30'
  tags:
  - badcase
  note: M-A A2-1 曾只落附近搜索；导航步骤从前序 items 取目的地
# 2026-08-02 badcase 三连（demo-e0n7go：f53d2e58/c0d1a8d2/4799fb1f）：「天气适合去哪玩」
# 只报天气、雨天推户外公园。组合判据归 guides/weather-outing；这里钉自含天气词的形态
# （话里自带「下雨天」→ 单步室内推荐 + weather_context 承接）。
- text: 下雨天去哪儿玩好
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      category: 室内
      weather_context: 雨
  source: trace
  added: '2026-08-02'
  tags:
  - badcase
  note: badcase c0d1a8d2 族——雨天「去哪玩」要条件化推荐不要报天气
- text: 你确定下雨天还推荐我去公园吗
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      category: 室内
      weather_context: 雨
  source: trace
  added: '2026-08-02'
  tags:
  - badcase
  note: badcase 4799fb1f——质疑轮是纠错，改推室内，不许原样再推户外
# 2026-08-02 泓舟裁定「找=发现 / 导航=出行」的载体（台账 nearby-navigation.find-vs-go）。
# 说法刻意避开对抗语料原句「我要加油」——把语料原句写成范例，那条 unseen 用例就变成
# seen，之后再读「通过率涨了」就读不出泛化（findings §4.3-2）。
- text: 油不多了，附近哪儿有加油站
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 加油站
  source: manual
  added: '2026-08-02'
  tags:
  - badcase
  note: 加油是需求不是动作——既不是开油箱盖，也不是直接发起导航
- text: 这边有地铁站吗
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 地铁站
  source: manual
  added: '2026-08-02'
  tags:
  - badcase
  note: 找/搜/有没有 归发现；导航去/带我去 才归 navigation
