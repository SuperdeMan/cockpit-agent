# MCP 准入清单（M3 P2）—— **唯一准入依据，改这个文件 + 人工审才能接新工具**。
#
# 母提案 §4.F「MCP 动态放行注册」是明确的不做项：外部服务改了接口，我们必须重新审，
# 而不是自动接受。所以这里同时锁三样东西：
#   1. server 版本（`version` 与 server 自报的 serverInfo.version **逐字相等**，否则拒载；
#      **远程托管 server 留空**——平台版本随平台升级，锁定粒度收敛到工具级 schema_sha，§9.9）
#   2. tool 白名单（server 多提供的工具直接忽略；清单里有而 server 没有 → 记拒绝理由）
#   3. tool schema 指纹（`schema_sha`，接口变了就拒载重审；留空=首次接入，只记录不校验）
#
# 写操作额外强制：补偿声明（§9.9 批 3）——`compensate_policy: tool`（默认）须给
# `compensate_tool` 且在本 server 白名单内；`abandon_unpaid`（创建未支付订单、扫码
# 才付钱型）须在 confirm_prompt 说明「不支付将自动取消」。
#
# 批 3 起支持 `transport: streamable_http`（仅官方商户远程端点）：`url` + `headers`
# （值可 `${ENV_VAR}` 引用——token 不进本文件；**缺 env 该 server 整台拒载**）。
# 商户下单回支付链接的，声明 `pay_url_locator`（点路径）+ `pay_url_hosts`（域名白
# 名单第一层）→ 桥经 payment-gateway 登记 merchant_hosted 会话出付款码卡（§9.17）。
#
# 契约登记见 docs/conventions.md §9.9。

servers:
  - id: demo-coffee
    # **演示商户**：真实商户的替身，存在的唯一目的是让写操作生命周期能在真栈被验证。
    # demo: true → 卡片打 _prov=demo + HMI「演示商户」角标 + 话术明说（诚实标注是硬要求）。
    demo: true
    trust: third_party
    transport: stdio
    command: ["python", "-m", "agents.mcp_bridge.demo_servers.demo_coffee"]
    version: "0.1.0"
    startup_timeout_ms: 20000
    tools:
      # ── 只读 ──
      - name: menu.list
        intent: shop.menu
        write: false
        schema_sha: "f46214ddb414"
        description: 查看咖啡店菜单与价格（演示商户）
        slots: []
        examples: ["咖啡有什么", "看看咖啡菜单", "咖啡多少钱"]
        timeout_ms: 8000
      # ── 可确认写入（生命周期五项齐备才允许准入）──
      - name: order.create
        intent: shop.order
        write: true
        require_confirm: true          # 中央确认闸（M0a）会强制落实，Agent 漏标也拦得住
        idempotency_key_arg: idempotency_key
        compensate_tool: order.cancel  # 缺它 → admission 拒载
        schema_sha: "041a13dc1703"
        description: 下单一杯咖啡（演示商户，不产生真实交易）
        confirm_prompt: "准备下单：{args}，确认吗？"
        # 规划期槽位用自然词（LLM 会填 item/size），经 arg_map 翻成商户的参数名
        slots: [item, size]
        arg_map: {item: sku, size: size}
        examples: ["点一杯拿铁", "来杯大杯美式", "帮我买杯咖啡"]
        timeout_ms: 15000
      # ── 查单（只读）──
      # M-D：**「查一下我的订单」此前是一句空话**——话术承诺过它，而准入清单里
      # 只有 menu/order（验收抓到后先把话术改成不承诺）。这条补上真入口。
      # 它同时是「超时到底下没下成」的核对手段：下单超时那一单我们没有 order_id
      # （响应没回来），但幂等键是我们自己生成的、商户按它索引。
      - name: order.get
        intent: shop.order_status
        write: false
        schema_sha: "df8761c5f320"
        description: 查询咖啡订单的状态（演示商户）
        slots: [order_id]
        examples: ["查一下我的订单", "我那杯咖啡好了吗", "刚才的单子怎么样了"]
        timeout_ms: 8000
      # ── 取消（可确认写入）──
      # `order.cancel` 从一开始就在商户侧存在、也被 order.create 声明为
      # compensate_tool，但**从没进过准入清单**——于是补偿只在准入期被校验存在性，
      # 运行期零调用、用户零入口（验收原话）。放进来它才成为真实可达的能力。
      # 仍是写操作：走 require_confirm，中央闸兜底；**不做未经确认的自动补偿**。
      - name: order.cancel
        intent: shop.order_cancel
        write: true
        require_confirm: true
        idempotency_key_arg: ""
        compensate_tool: order.cancel   # 取消自身幂等（再取消返回 duplicate）
        schema_sha: "943700876d93"
        description: 取消咖啡订单并退款（演示商户，不产生真实交易）
        confirm_prompt: "准备取消订单 {args} 并退款，确认吗？"
        slots: [order_id]
        examples: ["取消我的咖啡订单", "那杯咖啡不要了", "帮我把订单退了"]
        timeout_ms: 12000

