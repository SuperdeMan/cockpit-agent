schema_version: 1
# A2 主体与对象翻转：车/手机、人/地点、同一个动词不同对象。
#
# 每对都是**最小语义变化**：句式与动词尽量逐字保持，只换被作用的对象，落域必须翻。
# 这类用例的价值不在难度，而在**它能把「模型其实只认动词」这件事照出来**。
#
# relation 一律只声明 l1：L0 的快照没有 plan，route_flip 在那一层恒为假。
cases:
  - id: os.battery.car
    title: 车没电了
    family_id: os.battery
    cohort: seen_regression
    risk: medium
    status: reviewed
    tags: {attacks: [A2], mechanisms: [subject_flip], domains: [charging, chitchat], layers: [l1], gate_candidate: true}
    provenance: {kind: real_badcase, source_ref: docs/design/2026-07-28-intent-accuracy-data-flywheel.md, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02}
    turns:
      - input: {utterance: 车没电了, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [charging.find]}], forbidden_intents: [chitchat.talk, nearby.search], allow_extra_intents: false}
