# MCP 准入清单（M3 P2）—— **唯一准入依据，改这个文件 + 人工审才能接新工具**。
#
# 母提案 §4.F「MCP 动态放行注册」是明确的不做项：外部服务改了接口，我们必须重新审，
# 而不是自动接受。所以这里同时锁三样东西：
#   1. server 版本（`version` 与 server 自报的 serverInfo.version **逐字相等**，否则拒载；
#      **远程托管 server 留空**——平台版本随平台升级，锁定粒度收敛到工具级 schema_sha，§9.9）
#   2. tool 白名单（server 多提供的工具直接忽略；清单里有而 server 没有 → 记拒绝理由）
#   3. tool schema 指纹（`schema_sha`，接口变了就拒载重审；留空=首次接入，只记录不校验）
#
# 写操作额外强制：显式幂等模式 + `require_confirm: true` + 补偿声明。`tool` 须给
# 通过准入的 `compensate_tool`；`abandon_unpaid` 须在 confirm_prompt 确定性说明
# 「不支付会自动取消/失效/过期」；`terminal` 只用于取消等生命周期终态动作。
#
# 批 3 起支持 `transport: streamable_http`（仅官方商户远程端点）：`url` + `headers`
# （值可 `${ENV_VAR}` 引用——token 不进本文件；**缺 env 该 server 整台拒载**）。
# 商户下单回支付链接的，声明 `pay_url_locator`（点路径）+ `pay_url_hosts`（域名白
# 名单第一层）→ 桥经 payment-gateway 登记 merchant_hosted 会话出付款码卡（§9.17）。
#
# 契约登记见 docs/conventions.md §9.9。

servers:
  - id: demo-coffee
    # **演示商户**：真实商户的替身，存在的唯一目的是让写操作生命周期能在真栈被验证。
    # demo: true → 卡片打 _prov=demo + HMI「演示商户」角标 + 话术明说（诚实标注是硬要求）。
    demo: true
    trust: third_party
    transport: stdio
    command: ["python", "-m", "agents.mcp_bridge.demo_servers.demo_coffee"]
    version: "0.1.0"
    startup_timeout_ms: 20000
    tools:
      # ── 只读 ──
      - name: menu.list
        intent: shop.menu
        write: false
        expose: true
        forward_owner: true
        required_scopes: []
        idempotency_mode: none
        retry_policy: safe
        schema_sha: "f46214ddb414"
        description: 查看咖啡店菜单与价格（演示商户）
        slots: []
        examples: ["咖啡有什么", "看看咖啡菜单", "咖啡多少钱"]
        timeout_ms: 8000
      # ── 可确认写入（生命周期五项齐备才允许准入）──
      - name: order.create
        intent: shop.order
        write: true
        require_confirm: true          # 中央确认闸（M0a）会强制落实，Agent 漏标也拦得住
        expose: true
        forward_owner: true
        required_scopes: []
        idempotency_mode: upstream
        retry_policy: never
        idempotency_key_arg: idempotency_key
        compensate_tool: order.cancel  # 缺它 → admission 拒载
        schema_sha: "041a13dc1703"
        description: 在演示咖啡店下单一杯咖啡（仅限拿铁/美式/摩卡等演示饮品；麦当劳/瑞幸等真实品牌的餐饮下单暂未接入，不适用本工具）
        confirm_prompt: "准备下单：{args}，确认吗？"
        # 规划期槽位用自然词（LLM 会填 item/size），经 arg_map 翻成商户的参数名
        slots: [item, size]
        arg_map: {item: sku, size: size}
        examples: ["点一杯拿铁", "来杯大杯美式", "帮我买杯咖啡"]
        timeout_ms: 15000
      # ── 查单（只读）──
      # M-D：**「查一下我的订单」此前是一句空话**——话术承诺过它，而准入清单里
      # 只有 menu/order（验收抓到后先把话术改成不承诺）。这条补上真入口。
      # 它同时是「超时到底下没下成」的核对手段：下单超时那一单我们没有 order_id
      # （响应没回来），但幂等键是我们自己生成的、商户按它索引。
      - name: order.get
        intent: shop.order_status
        write: false
        expose: true
        forward_owner: true
        required_scopes: []
        idempotency_mode: none
        retry_policy: safe
        schema_sha: "df8761c5f320"
        description: 查询咖啡订单的状态（演示商户）
        slots: [order_id]
        examples: ["查一下我的订单", "我那杯咖啡好了吗", "刚才的单子怎么样了"]
        timeout_ms: 8000
      # ── 取消（可确认写入）──
      # `order.cancel` 从一开始就在商户侧存在、也被 order.create 声明为
      # compensate_tool，但**从没进过准入清单**——于是补偿只在准入期被校验存在性，
      # 运行期零调用、用户零入口（验收原话）。放进来它才成为真实可达的能力。
      # 仍是写操作：走 require_confirm，中央闸兜底；**不做未经确认的自动补偿**。
      - name: order.cancel
        intent: shop.order_cancel
        write: true
        require_confirm: true
        expose: true
        forward_owner: true
        required_scopes: []
        idempotency_mode: local_at_most_once
        retry_policy: never
        idempotency_key_arg: ""
        compensate_policy: terminal
        schema_sha: "943700876d93"
        description: 取消咖啡订单并退款（演示商户，不产生真实交易）
        confirm_prompt: "准备取消订单 {args} 并退款，确认吗？"
        slots: [order_id]
        examples: ["取消我的咖啡订单", "那杯咖啡不要了", "帮我把订单退了"]
        timeout_ms: 12000

  # ══════════════════════════════════════════════════════════════════
  # 麦当劳官方 MCP（2026-08-11 真机核实激活：serverInfo=mcd-mcp 1.0.0，29 工具，
  # tools/list 快照与全量 inputSchema 见当日会话产物；schema_sha 按真机指纹锁死）。
  #
  # **v1 只激活只读两件**（参数自洽、零资金风险）。`create-order` 刻意不进 v1：
  # 真机 schema 显示它是强多步流程 API——items 是结构化数组，且全链硬依赖
  # query-nearby-stores 返回的 storeCode/beCode（连 query-meals 查菜单都 required
  # storeCode）。桥的「扁平 slots→LLM 填→arg_map」单步机制接不住这条链——这是
  # **编排能力面**（planner 结构化参数 + 步间结果引用）的工程问题，不是配置问题；
  # 硬接=下单参数靠猜。二期条件：planner 支持步间结构化引用后，按
  # compensate_policy: abandon_unpaid + pay_url_locator: "payH5Url"（官方接入指南
  # 确认的字段名）接入，支付闭环机制已由 demo-coffee 全链路验证。
  # 真机还确认：**29 工具中无取消类工具**——abandon_unpaid 判断坐实。
  - id: mcdonalds
    demo: false
    trust: third_party
    transport: streamable_http
    url: https://mcp.mcd.cn
    headers:
      Authorization: "Bearer ${MCD_MCP_TOKEN}"
    version: ""                    # 远程托管平台：版本不锁（自报 1.0.0），工具级 schema_sha 锁
    startup_timeout_ms: 20000
    pay_url_hosts: [m.mcd.cn]      # 二期下单用；只读工具不产链接
    # `query-nearby-stores` 刻意不激活：「附近有麦当劳」是 nearby.search（高德真
    # 数据+导航）的既有地盘，门店 intent 的真实价值在二期下单链（拿 storeCode）
    # ——不为激活数量保留一个与既有能力打架的 intent。
    tools:
      - name: list-nutrition-foods
        intent: mcd.menu
        speech_mode: summarize
        write: false
        expose: true
        forward_owner: false
        required_scopes: []
        idempotency_mode: none
        retry_policy: safe
        schema_sha: "9e2fcd061b03"
        # 诚实描述：这是常见餐品与营养成分（能量/蛋白质等），不是当店实时价目——
        # 带价格的当店菜单（query-meals）required storeCode，归二期多步链
        description: 麦当劳常见餐品与营养成分（热量/蛋白质等；当店价格需选定门店后查询）
        slots: []
        examples: ["麦当劳有什么吃的", "巨无霸多少大卡", "麦当劳哪个热量低"]
        timeout_ms: 12000
      - name: query-order
        intent: mcd.order_status
        speech_mode: summarize
        write: false
        expose: true
        forward_owner: false
        required_scopes: [merchant.read]
        idempotency_mode: none
        retry_policy: safe
        schema_sha: "6c5c0def4de0"
        description: 查询麦当劳订单状态与配送进度（商家是订单状态的真相源）
        slots: [order_id]
        arg_map: {order_id: orderId}
        examples: ["我的麦当劳订单到哪了", "麦当劳那单好了吗"]
        timeout_ms: 12000

  # ── 瑞幸官方 MCP（2026-08-11 真机核实激活：serverInfo=luckyordermcpmaster 1.0.0，
  # 8 工具）。**v1 只激活订单查询一件**：
  # - queryShopList required 精确经纬度——third_party 桥被硬上限表禁 location.precise
  #   （ws8 红线），结构性不可激活；「附近的瑞幸」本就归 nearby.search（高德）。
  # - searchProductForMcp/queryProductDetailInfo/previewOrder/createOrder 全链硬依赖
  #   deptId（先选店）与 productList 结构化数组——同麦当劳，归二期编排能力面。
  # - **cancelOrder 真机存在**（外部补偿里的 tool 形态，与麦当劳 abandon_unpaid 各占
  #   其一）：二期 createOrder 接入时 compensate_policy: tool + compensate_tool:
  #   cancelOrder；v1 不单独激活取消（写操作且上游下单未接，空转能力）。
  - id: luckin
    demo: false
    trust: third_party
    transport: streamable_http
    url: https://gwmcp.lkcoffee.com/order/user/mcp
    headers:
      Authorization: "Bearer ${LUCKIN_MCP_TOKEN}"
    version: ""                    # 远程托管平台：版本不锁（自报 1.0.0），工具级 schema_sha 锁
    startup_timeout_ms: 20000
    pay_url_hosts: []              # 二期下单时按真实响应的支付链接域名回填
    tools:
      - name: queryOrderDetailInfo
        intent: luckin.order_status
        speech_mode: summarize
        write: false
        expose: true
        forward_owner: false
        required_scopes: [merchant.read]
        idempotency_mode: none
        retry_policy: safe
        schema_sha: "095c2b916b52"
        description: 查询瑞幸咖啡订单详情与状态（商家是订单状态的真相源）
        slots: [order_id]
        arg_map: {order_id: orderId}
        examples: ["我瑞幸的单子怎么样了", "瑞幸咖啡做好了吗", "查一下瑞幸订单"]
        timeout_ms: 12000
