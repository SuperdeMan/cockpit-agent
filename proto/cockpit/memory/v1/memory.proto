syntax = "proto3";

package cockpit.memory.v1;

// 上下文的唯一真相源：短期会话、车辆上下文、长期画像。
service Memory {
  rpc GetContext (GetContextRequest) returns (GetContextResponse); // 按 scopes 取上下文
  rpc AppendTurn (AppendTurnRequest) returns (AppendTurnResponse); // 写入一轮对话
  rpc GetSession (GetSessionRequest) returns (GetSessionResponse); // 取最近 N 轮
  rpc UpsertProfile (UpsertProfileRequest) returns (UpsertProfileResponse); // 写用户画像（如常用地点 places）

  // 分层记忆重构（2026-06-25，向后兼容追加）：语义画像 + 情景记忆。
  // 设计见 docs/design/2026-06-25-memory-system-redesign.md
  rpc Remember (RememberRequest) returns (RememberResponse);   // 写语义/情景记忆（抽取管线或 Agent 显式）
  rpc Recall (RecallRequest) returns (RecallResponse);         // 语义召回（向量 + scope/occupant + 时序融合）
  rpc ForgetUser (ForgetUserRequest) returns (ForgetUserResponse); // 合规：删除用户全量记忆
  rpc ExportUser (ExportUserRequest) returns (ExportUserResponse); // 合规：导出用户全量记忆
  // M2 记忆图谱 P1：关系边一跳查询。**刻意不做通用图遍历 RPC**——v1 只有两种消费形态
  // （按实体查边 / 人称→地点一跳），开放多跳会长出没人验证的推理路径。
  rpc QueryRelations (QueryRelationsRequest) returns (QueryRelationsResponse);
  rpc ResolvePersonPlace (ResolvePersonPlaceRequest) returns (ResolvePersonPlaceResponse);

  // M4 P4 声纹多用户：模板的**存储与比对**归记忆域（生物特征数据；GDPR 级联删是红线），
  // 「音频→向量」归 llm-gateway（模型面，架构承诺=模型调用唯一出口）。分工与理由见
  // docs/design/2026-07-25-m4-p4-voiceprint-vision-rfc.md §2.1。
  // **红线：occupant_id 只进记忆域，绝不作鉴权因子**（§6.1，源码级断言测试钉死）。
  rpc EnrollVoiceprint (EnrollVoiceprintRequest) returns (EnrollVoiceprintResponse);
  rpc IdentifySpeaker (IdentifySpeakerRequest) returns (IdentifySpeakerResponse);
  rpc ListVoiceprints (ListVoiceprintsRequest) returns (ListVoiceprintsResponse);
  rpc DeleteVoiceprint (DeleteVoiceprintRequest) returns (DeleteVoiceprintResponse);
}

message GetContextRequest {
  string session_id = 1;
  string user_id = 2;
  string vehicle_id = 3;
  repeated string scopes = 4;       // e.g. "vehicle.location","profile.taste"
}
message GetContextResponse {
  map<string, string> values = 1;   // scope -> JSON 字符串
}

message AppendTurnRequest {
  string session_id = 1;
  string role = 2;                  // user | assistant
  string text = 3;
  // 评审后补：供异步抽取管线知道把记忆写给谁（向后兼容，旧调用方不传=不触发抽取）
  string user_id = 4;
  string vehicle_id = 5;
  string occupant_id = 6;
}
message AppendTurnResponse { bool ok = 1; }

message GetSessionRequest {
  string session_id = 1;
  uint32 last_n = 2;
}
message Turn {
  string role = 1;
  string text = 2;
  int64 ts = 3;
}
message GetSessionResponse { repeated Turn turns = 1; }

message UpsertProfileRequest {
  string user_id = 1;
  string key = 2;          // 画像字段名，如 "places"
  string value_json = 3;   // 该字段的完整 JSON 值（如 places map 全量）
}
message UpsertProfileResponse { bool ok = 1; }

// ── 分层记忆（语义画像 / 情景记忆）──────────────────────────────
// 一条可独立失效的记忆。语义=偏好/事实（带 predicate），情景=事件（summary 进 text）。
message MemoryItem {
  string id = 1;            // uuid；写入留空由服务端生成
  string kind = 2;         // "semantic" | "episodic" | "procedural"
  string user_id = 3;
  string occupant_id = 4;  // 多用户维度，默认 "primary"
  string predicate = 5;    // 语义谓词/键，如 "taste.spicy" "place.home"；情景留空
  string text = 6;         // 自然语言陈述/事件摘要（向量化源）
  string value_json = 7;   // 结构化值（可空）
  string provenance = 8;   // "user_stated" | "agent_inferred"
  float confidence = 9;
  string scope = 10;       // 隐私/权限 scope，如 "profile.taste"
  int64 valid_from = 11;   // epoch 秒
  string superseded_by = 12; // 被哪条记忆取代（时序-lite，空=现行）
  int64 source_ts = 13;
  string source_session = 14;
  // 评审后补：量产治理字段（多数 P0 仅存储，level/vehicle 感知召回留后期）
  string tenant_id = 15;       // 多车企/多环境隔离（空=default）
  string vehicle_id = 16;      // 车级偏好用；用户级留空
  string memory_level = 17;    // user | vehicle | occupant | session
  string embedding_model = 18; // 向量来源模型（换模型重算依据）
  string privacy_level = 19;   // normal | sensitive | highly_sensitive
  int64 valid_to = 20;         // 0=至今
  int64 expires_at = 21;       // 0=不过期；临时偏好设此
  string review_status = 22;   // auto_extracted | user_confirmed | rejected | corrected
  string source_turn_ids = 23; // 抽取证据轮次（逗号分隔）
  // M2 记忆图谱 P0：偏好强度。weight=0 表示未参与加权（M2 前的存量条目 / 非 semantic），
  // 消费方一律回退 confidence——存量行为逐字不变（memory/weighting.effective_confidence）。
  float weight = 24;           // 0-1，巩固期算出：base(provenance) + 重复证据加成，再乘时间衰减
  int32 evidence_count = 25;   // 支撑该偏好的独立证据轮次数（「说过一次」vs「每周三次」的区分依据）
  float half_life_days = 26;   // 0=不衰减（显式偏好）；推断类默认 90 天
  string consent = 27;         // ''=未特别声明（沿用 privacy_level）；'explicit'=用户显式授权的敏感画像
}

message RememberRequest { repeated MemoryItem items = 1; }
message RememberResponse { repeated string ids = 1; bool ok = 2; }

message RecallRequest {
  string user_id = 1;
  string occupant_id = 2;          // 空=默认 "primary"
  string query = 3;                // 自然语言查询，向量召回
  repeated string scopes = 4;      // 限定 scope（权限/隐私），空=不限
  repeated string kinds = 5;       // 限定 semantic/episodic/...，空=不限
  uint32 top_k = 6;                // 0=默认 5
  bool include_superseded = 7;     // 默认 false：只取现行
  // 评审后补：精确优先 + 阈值（避免低相关记忆污染 planner）
  string predicate_prefix = 8;     // 精确画像读取：按谓词前缀过滤（如 "place." "taste."）
  float min_score = 9;             // 相关性下限（0=不限）
  float min_confidence = 10;       // 置信度下限（0=不限）
  uint32 max_age_days = 11;        // 最大年龄天数（0=不限）
}
message RecallResponse {
  repeated MemoryItem items = 1;
  repeated float scores = 2;       // 与 items 一一对应的相似度
}

message ForgetUserRequest {
  string user_id = 1;
  string occupant_id = 2;          // 空=该 user 全部乘员
  repeated string scopes = 3;      // 空=全部 scope
}
message ForgetUserResponse { bool ok = 1; uint32 deleted = 2; }

message ExportUserRequest { string user_id = 1; }
message ExportUserResponse { string json = 1; } // 全量记忆 + 画像的 JSON

// ── M2 记忆图谱 P1：关系边 ──────────────────────────────────────────────
message RelationEdge {
  string subject = 1;        // 实体名（"小雨"）
  string rel = 2;            // 封闭词表：family|place_of|works_at|lives_at|owns|prefers_brand
  string object = 3;         // 实体名或字面值（"女儿" / "XX小学"）
  string object_ref = 4;     // 可选：memory_item.id 或 profile.places 键
  float confidence = 5;
  string provenance = 6;
  string source_turn_ids = 7;
}

message QueryRelationsRequest {
  string user_id = 1;
  string occupant_id = 2;    // 空=primary
  string subject = 3;        // 任意组合精确查（空=不限）；不做模糊匹配
  string rel = 4;
  string object = 5;
  int32 limit = 6;
}
message QueryRelationsResponse { repeated RelationEdge edges = 1; }

// 「去接孩子放学」：人称词 → family 边定人 → place_of 边定地点。
// 查不到 / 有歧义一律 found=false —— 导航到错地方比查不到更糟，调用方须诚实追问。
message ResolvePersonPlaceRequest {
  string user_id = 1;
  string occupant_id = 2;
  string person_word = 3;    // 话术里的人称词（"孩子"/"女儿"/"老婆"）
}
message ResolvePersonPlaceResponse {
  bool found = 1;
  string person = 2;         // 解析到的实体名（"小雨"）
  string place = 3;          // 地点（"XX小学"）
  string object_ref = 4;
}

// ── M4 P4：声纹模板（生物特征，契约见 docs/conventions.md §9.11）─────────────
// 只传向量不传音频：原始音频在网关提完 embedding 即弃，永不跨服务、永不落库。
message VoiceVector { repeated float values = 1; }

message EnrollVoiceprintRequest {
  string user_id = 1;
  // 空=服务端分配。**首个注册者分配到 "primary"**——存量记忆全在该 occupant 名下，
  // 若首个注册者拿到 occ-1，他自己过去说过的一切当场失联（RFC §3.4，本设计最大的回归点）。
  string occupant_id = 2;
  string display_name = 3;
  repeated VoiceVector samples = 4;  // 每段录音一条，已 L2 归一；服务端取均值再归一为模板
  string model = 5;                  // 提取模型标识；与识别期不一致的模板视为 stale，提示重录
  string tenant_id = 6;
}
message EnrollVoiceprintResponse {
  bool ok = 1;
  string occupant_id = 2;
  string display_name = 3;
  uint32 sample_count = 4;
  float self_consistency = 5;   // 各段两两余弦均值；过低=录音里混了别人/噪声 → 拒绝建模板
  string error = 6;             // ok=false 时非空，如 "low_consistency" / "dim_mismatch"
}

message IdentifySpeakerRequest {
  string user_id = 1;
  VoiceVector probe = 2;
  string model = 3;             // 与模板 model 不一致的模板一律跳过（跨模型比余弦没有意义）
  string tenant_id = 4;
}
message IdentifySpeakerResponse {
  // 判定结果。**认不出一律回 "primary"**（诚实降级）——不是 guest/unknown：primary 是存量
  // 语义，降到它=逐字回落今天；造一个新身份等于让用户体感「车失忆了」（RFC §3.3）。
  string occupant_id = 1;
  string display_name = 2;
  string decision = 3;          // accept | below_threshold | ambiguous | no_templates | stale_model
  float score = 4;              // top1 余弦
  float runner_up = 5;          // top2 余弦（ambiguous 判据：top1-top2 < margin 即分不开）
}

message ListVoiceprintsRequest {
  string user_id = 1;
  string tenant_id = 2;
  string model = 3;             // 非空则据此标记 stale；空=不计算
}
message VoiceprintInfo {
  string occupant_id = 1;
  string display_name = 2;
  uint32 sample_count = 3;
  float self_consistency = 4;
  int64 updated_at = 5;
  string model = 6;
  bool stale = 7;
}
message ListVoiceprintsResponse {
  repeated VoiceprintInfo occupants = 1;
  // 判定阈值随清单一起回：判定在 memory 侧（模板在这儿），但 /api/voiceprint/info 要能如实报出来。
  float threshold = 2;
  float margin = 3;
}

message DeleteVoiceprintRequest {
  string user_id = 1;
  string occupant_id = 2;
  // true=同时删该乘员的 memory_item 与 memory_relation。用户说「删掉小雨」时的预期是
  // 「忘掉这个人」，不是「留着记忆但认不出他」（RFC §3.4）。
  bool purge_memory = 3;
  string tenant_id = 4;
}
message DeleteVoiceprintResponse {
  bool ok = 1;
  uint32 deleted_templates = 2;
  uint32 deleted_memories = 3;
}
