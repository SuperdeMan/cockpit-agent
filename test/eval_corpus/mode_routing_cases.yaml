# 裁定变更（2026-08-02，泓舟）：新闻列表后的「第N条/这条 详细讲讲」= **就地展开**，
# 不再升级成分钟级异步深调研——用户要的是「这条多说两句」，开一张后台调研单是过度升级。
# 「第N点/节/部」（报告章节量词）仍归 research，deep-research#1 的量词集已相应收窄。
# 同一裁定同时解掉对抗语料 cs.more.news 与本文件之间的自相矛盾。
