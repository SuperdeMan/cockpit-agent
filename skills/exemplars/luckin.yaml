# 纯发现边界「附近有没有瑞幸」→ nearby.search 不进本文件；上面两条是受控例外：
# nearby 只负责可信采集门店，后续 luckin.order 通过 depends_on + slot_refs 消费结果。
# 纯发现边界仍由对抗语料 cc.negative.luckin-nearby-not-status 与 mode_routing_cases 锁定。
# luckin.menu（2026-08-13）：只读看菜单。在它之前「这家店的菜单」在能力目录里
# 只对应演示商户 shop.menu，真实门店问句因此答出演示数据（trace 9899486a8773d577）。
# 两条范例都带 nearby.search 前置——官方菜单绑 deptId，绕不开选店。
# ── 2026-08-13 demo-mkemhn 收口：选店闭环三式 ────────────────────────────────
# 焦点(300s)与选店草稿(600s)双过期后，候选卡按钮文本「选择瑞幸门店：X」与指名门店
# 句都曾走进「请先查询附近的瑞幸门店」死路（78b635db/b69a16d9）。教 planner 用
# nearby.search 按名把门店真实取回再续业务步——可信链当轮重建，不依赖任何过期状态。
- text: 选择瑞幸门店：深铁金融科技大厦店
  plan:
  - id: store
    agent: nearby
    intent: nearby.search
    slots:
      keyword: 瑞幸咖啡 深铁金融科技大厦店
  - id: menu
    agent: mcp-bridge
    intent: luckin.menu
    depends_on: [store]
    slot_refs:
      store_name: store.data.items.0.name
      store_longitude: store.data.items.0.lng
      store_latitude: store.data.items.0.lat
  source: trace
  added: '2026-08-13'
  tags:
  - badcase
  note: demo-mkemhn 78b635db——候选卡按钮文本是固定句式，必须恒久可用（看菜单是选店后最安全的续接）
- text: 科苑南路店这家瑞幸咖啡，我要看看菜单
  plan:
