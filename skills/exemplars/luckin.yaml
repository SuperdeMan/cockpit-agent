- text: 瑞幸迪美店点一杯热生椰拿铁，半糖
  plan:
  - id: store
    agent: nearby
    intent: nearby.search
    slots:
      keyword: 瑞幸咖啡 迪美店
  - id: order
    agent: mcp-bridge
    intent: luckin.order
    slots:
      item_query: 生椰拿铁
      quantity: '1'
      temperature: 热
      sweetness: 半糖
    depends_on: [store]
    slot_refs:
      store_name: store.data.items.0.name
      store_longitude: store.data.items.0.lng
      store_latitude: store.data.items.0.lat
  source: manual
