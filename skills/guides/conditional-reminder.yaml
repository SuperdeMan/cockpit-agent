name: conditional-reminder
type: guide
description: 查询结果决定后续动作的条件句（如果/要是…就…，如下雨就提醒带伞、降温就提醒加衣）只规划查询步并标 adaptive；顺承并列（查完然后提醒）两步都要；持久订阅（一旦/只要/每当…就通知我）只交给提醒域
priority: 65
capability_dependencies: [info.weather, reminder.create]
# 「然后提醒 / 别提醒」是 2026-08-03 补的：这条知识的职责是判「提醒该不该做」，
# 而它此前只被条件句形态的词检回。顺承句与否定句检不回它，等于把三分判据里的两分
# 关在门外——nq.umbrella.both 的漏步正发生在检回了却按条件句读的那一档。
# 「第二轮」是 2026-08-04 补的（cp.adaptive.rain-umbrella：首轮 adaptive 判对了，
# 再规划轮却把查询步又排了一遍）。⚠ 补它的时候踩了一次预算坑：知识写到 1504 字符后
# **整条被 SKILL_BUDGET 挤出注入**（`ki.conditional-reminder.hit` 当场红），
# 补完必须回头量一次注入块长度——**加知识和加 policy 一样会挤掉知识**。
keywords: [如果, 要是, 的话, 就提醒, 下雨就, 提醒我带, 然后提醒, 别提醒, 一旦, 每当, 就通知我, 就告诉我, 就叫我]
knowledge: |
  先判定提醒做不做。**判据是句里有没有条件词/否定词/订阅词，不是提醒有没有说时间**：
  - **条件依赖**（『如果/要是/万一/…的话/要下就』+ 一件现在能查的事）：提醒做不做取决于查询结果。
  - **否定或推迟**（『别/不要/先别/不用/取消』）：那件事**不做**，只规划留下来的那件。
  - **顺承并列**（『然后/接着/再/顺便/另外』连接，既没有条件词也没有否定词）：
    两件事都要做，reminder.create 与查询是两个独立步骤，不能把提醒吞掉。
  - **持久订阅**（『一旦/只要/每当/每次/凡是…就通知我/提醒我/告诉我』，没有要现在查的事、没有具体
    时间）：要的是盯着变化再通知，不是查一次。**只规划 reminder.create**、整句交给提醒域（它会说明
    做不到）；不查天气/路况、不标 adaptive。

  ⚠ **提醒没说时间，仍然是顺承并列**（『查下天气，然后提醒我带伞』）：把「没说时间」当成条件句证据
  是最常见的误读，代价是两件只做成一件；时间缺失由提醒域追问。

  **条件依赖**必须 adaptive：首轮只规划查询步，看到结果再决定 Y；不把 Y 无条件排进计划，
  也不只查不管 Y。

  **第二轮按最近观察兑现**。例：目标『有降水就提醒收衣物』，最近观察 `status=ok, intent=info.weather`
  且 `data` 中 `condition=阵雨` ⇒ 条件成立：`done=false`、只出 reminder.create，不再出 info.weather，
  也不直接结束；观察明确无雨才 `done=true`。两种结果都不重排已完成的查询步。

  **时间槽只写用户说出口的**：`time_text` 取提醒那半句原话；另一半句的『明天/后天』是查询的
  限定词；范例的『明天早上八点』只是格式示范。没说时间就留空。

  顺承示例『看下今天空气质量，然后提醒我出门戴口罩』：simple、查询与提醒两步；标题「出门戴口罩」，
  time_text 留空。
few_shots:
  # 首轮结构必须可模仿：只查条件前件，后件留给 observation replan。
  - user: 先看看今晚会不会降温，若降温就叫我加件衣服
    plan: {"complexity":"adaptive","steps":[{"id":"s1","agent_id":"info","intent":"info.weather","slots":{"date":"今晚"},"depends_on":[],"slot_refs":{}}]}
golden:
  # expect_not 是这条知识的另一半：条件句首轮绝不能把提醒无条件排进计划；
  # expect_complexity 是核心主张本身——条件依赖必须 adaptive（看结果再决定）
  # 天气族容忍（同 multi-day 先例）：本知识的主张是「只出查询步+adaptive」，
  # weather/forecast 族内怎么选归 mode_routing 管——严格钉 weather 会把族内方差
  # 记成知识功劳（2026-07-27 消融车道实测）
  - text: 查下明天会不会下雨，要是下雨就提醒我带伞
    expect_intents: ["info.weather|info.forecast"]
    expect_not: [reminder.create]
    expect_complexity: adaptive
  # holdout：避开 knowledge 原句与全部 keywords 字面（测泛化不测自证）
  - text: 看下明晚会不会下雨，要下就叫我收衣服
    expect_intents: ["info.weather|info.forecast"]
    expect_not: [reminder.create]
    expect_complexity: adaptive
    holdout: true
  # M-A A1-3 真栈反例：明确八点的提醒不依赖天气，『再看下』是并列连接词。
  - text: 明天早上八点提醒我带伞，再看下明天深圳会不会下雨
    expect_intents: [reminder.create, "info.weather|info.forecast"]
  # ── 2026-08-03 补：顺承并列且**提醒没说时间** ──────────────────────────
  # 立卡来源 nq.umbrella.both（对抗语料 stable）：两趟独立 live 各 3/3 只出 info.weather，
  # 而检索名单在通过的那次与失败的两次里逐字相同——不是检不回，是检回了按条件句读了。
  # 旧知识把并列的判据写成「提醒本身已经有**明确时间**」，于是「没说时间」被当成条件句
  # 的证据，提醒被整个吞掉。
  - text: 查下今晚的天气，然后提醒我出门穿厚一点
    expect_intents: ["info.weather|info.forecast", reminder.create]
  - text: 瞧一眼明早冷不冷，回头叫我多穿件外套
    expect_intents: ["info.weather|info.forecast", reminder.create]
    holdout: true
  # 三分判据的第三分：否定不能被新加的「顺承并列」规则顺手翻正。
  # 没有这条，"修好漏步"会以"该不做的也做了"的形式还回去。
  - text: 看下明早的空气质量，别提醒我戴口罩了
    expect_intents: ["info.air_quality|info.weather"]
    expect_not: [reminder.create]
  # ── 2026-09-20 补（批 6 W19-b）：第四分「持久订阅」──────────────────────
  # 真栈 RS9（release 485fccd1）：「之后一旦下雨就通知我」被本知识的 `下雨就` 检回、按条件依赖读成
  # 「查一次天气」（答今天没雨）；「只要有堵车就提醒我」按 `就提醒` 检回后给了路况查询（问路线）。
  # 两句都不是查一次——是订阅；提醒域有诚实拒绝出口，规划层只要把整句交给它。
  - text: 之后一旦下雨就通知我
    expect_intents: [reminder.create]
    expect_not: [info.weather, info.forecast]
  - text: 只要有堵车就提醒我
    expect_intents: [reminder.create]
    expect_not: [safety.road_condition, safety.driving_advice, info.search]
  # holdout：避开全部 keywords 字面（一旦/每当/就通知我/就告诉我/就叫我/就提醒…；「只要/每次/凡是」是常用词，刻意不做 keyword）
  - text: 往后一有暴雨预警就马上告诉我
    expect_intents: [reminder.create]
    expect_not: [info.weather, info.forecast]
    holdout: true
owner: orchestrator
version: 6
