    profile: root
    skip_reasons: [manual_review_required]
    signed_identity: true
    persistent_data: true
    memory_sessions: 0
    remote_safe: false
    remote_mutating: false

  # 支付真栈闭环（§9.17 批 2）：确认亮码 → mock 渠道自动支付 → 幂等防双付。
