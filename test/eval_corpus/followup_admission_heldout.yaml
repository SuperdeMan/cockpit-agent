contexts:
  weather: "北京今天晴，3到12度，西北风3级，早晚温差大。"
  nav: "已为您规划到宝安机场T3的路线，全程32公里，预计50分钟，途经广深沿江高速。"
  music: "为您播放陈奕迅的《十年》。"
  poi: "附近有四家火锅店，海底捞评分4.8最高，其次是小龙坎和巴奴。"
  know: "氢燃料电池车加氢只要几分钟，但加氢站很少，成本也高。"
  ask_time: "好的，明天几点出发？"
  ask_dest: "找到两个万达广场，您要去宝安的还是南山的？"
  confirm: "确认要关闭车道保持吗？"
  hvac: "座椅加热已打开，二档。"
  chat: "周末去海边确实不错，要不要我帮你看看那边的天气？"
  news: "体育新闻：中国女排三比零战胜日本队。"
  joke: "为什么数学书总是很忧郁？因为它有太多的问题。"
  reminder: "已提醒您明天上午九点交水电费。"
