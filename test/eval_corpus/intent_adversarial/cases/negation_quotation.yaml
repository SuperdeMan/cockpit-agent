  # ══ 立卡：裸对象澄清族换出 gate 预选池（2026-08-10，泓舟裁定走 findings §17.8 路径 3）══
  # **换出的是门禁资格，不是这个缺陷。** 两条用例一字未删、gold 一字未放宽，
  # status 由 stable 降为 reviewed —— discovery suite 的 statuses 含 reviewed，
  # 所以它们**继续每批跑**，只是不再决定 gate 能不能绿。等量换入 `nq.tesla.news`
  # 与 `nq.sichuan.search`（同为 A3，攻击面守恒；见本文件下方两条的晋级注释）。
  #
  # 判据（规格 §22.7）：**问「这条红是因为用例难，还是因为被测对象错」。**
  # 这一族是前者——`nq.landmark.bare` 两次无干预读数合并 **11/20≈55%**，
  # 是一条高方差边界句，不是稳定答错；把它留在门禁里等于让 `eligible` 长期挂在抛硬币上。
  #
  # 已试过并否掉的修法（findings §18，别再重来一遍）：
  #   写一条 guide 讲判据 → 四次 10 样本 4/10 → 3/10 → 1/10 → 退回后 7/10，
  #   Fisher p≈0.02 **有害**；guide 每次都成功注入，模型就是不照做。
  # 未启动的修法：给范例 schema 加「clarify 型范例」（范例 `plan` 必须非空，
  #   而正确产物恰恰是「先别落域」——要改契约 + 门禁 + 检索消费面）。
  #
  # ⚠ 同族还有 `nq.city.bare`「上海」（本文件下方，reviewed 从未进池）——**同一个缺陷的
  #   另一个马甲**。2026-08-10 挑换入候选时正是因为这一点排除了它：换入它等于把同族
  #   不稳定塞回门禁。三条一起跟，别只盯 landmark 这一对。
  - id: nq.landmark.bare
    title: 裸地名应当澄清
