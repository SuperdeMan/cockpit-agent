# commands.yaml — 车控命令 schema（来源：公版语音指令表 6.1）
# 每个 object 声明：operates/attrs/modes/positions/units/online/drive_restricted/require_confirm/voice_forbidden

objects:
  seat:
    display_name: 座椅
    operates:
    - open
    - close
    - set
    - inc
    - dec
    attrs:
    - temperature
    - speed
    modes:
    - heating
    - ventilation
    - massage
    - lumbar_support
    - recline
    - 加热
    - 通风
    - 按摩
    - 腰托
    - 放平
    positions: true
    units:
    - degree
    - level
    - percent
    online: offline_ok
    drive_restricted: false
    require_confirm: false
    effect: write
    edge_intents:
    - seat.heating.off
    - seat.heating.on
    - seat.lumbar_support.off
    - seat.lumbar_support.on
    - seat.massage.off
    - seat.massage.on
    - seat.ventilation.off
    - seat.ventilation.on
    voice_forbidden: false
    projects:
    - project-a
    - project-b
    - project-c
  window:
