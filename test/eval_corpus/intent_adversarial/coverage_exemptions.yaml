schema_version: 1
# 逐 intent、逐 requirement 的显式豁免。禁止 domain 级通配符；豁免某一 requirement
# 不顺带豁免另外两项。空列表 = 零豁免（不是全量豁免）。
#
# 本表全部是**端侧原子车控/媒体**。判据：它们由端侧 fast_intent 确定性分类后直接经
# VAL 执行，不经云侧 LLM 落域——对抗套件量的是「模型会不会选错域」，对这一类没有
# 可测的对象。它们的回归由 eval_fast_intent（端侧规则基线）、
# orchestrator/edge/tests/corpus/（88 条参数化对象矩阵）与 VAL 安全门控测试承担。
#
# **危险动作与核心开关不在此表**：trunk / door_lock / window / sunroof /
# charging_port / fuel_tank_cover / hvac 主开关与温度 / media 播放控制全部按
# 2+2+1 正常覆盖——它们既走端侧也可能被云侧规划，且误动作代价高。
#
# 授权：泓舟 2026-08-02（概括授权，非逐条人裁；见落地记录「审阅闸」一节）。
