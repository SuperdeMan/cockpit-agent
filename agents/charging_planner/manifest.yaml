agent_id: charging-planner
version: 0.1.0
display_name: 充能助手
category: core
trust_level: first_party
deployment: cloud
# Real Amap charging plans may require more than one provider round-trip.
# Keep the budget aligned with other external-route agents so a valid ordinal
# selection is not cancelled before route planning returns.
latency_budget_ms: 20000
fallback: chitchat

capabilities:
  # 判别化（2026-07-30 地盘收口）：**找充电桩一律归本条，不分「有没有电量语境」**。
  # 2026-07-19 周边发现重构曾把「纯发现（附近有没有充电站）」判给 nearby.search 出统一富卡，
  # 该判据本次作废——本条读真实 SOC（context_scopes: vehicle_state）、按**空闲优先**排序、
  # 支持目的地途经点，而 nearby 的评分/人均对充电桩毫无意义。M5 P2 双臂裸跑两档一致：
  # 摘掉 nearby 那条 replace 正则后，模型自己就落这里——是规则在 LLM 之后把对的踩成错的。
  - intent: charging.find
    contract:
      version: 2
      revision: '1'
      effect: read
      parameters:
        destination:
          type: string
          unit: ''
          region: ''
        soc:
          type: string
          unit: ''
          region: ''
        prefer:
          type: string
          unit: ''
          region: ''
      additional_parameters: legacy
      applicability:
        status: unspecified
        vehicle_models: []
        software_versions: []
      preconditions:
      - handler
      - permission
      idempotency: unknown
      verification: none
    description: 给车找充电站/充电桩（含「附近有充电桩吗」这类纯发现）——读车辆真实电量、
      按空闲状态与距离排序，可作为导航途经点；判据：没有询问词（多少/还剩/是否在充电/当前状态）、
      只是陈述车辆电量见底或因电量耗尽无法行驶，就是补能求助，必须归此能力，绝不归 charging.status；
      手机/耳机等随身设备充电不归此能力
    slots: [destination, soc, prefer]
    examples: ["找个充电站", "附近有充电桩吗", "快充在哪", "快没电了附近找个快充", "续航见底了帮我找补能点"]
  - intent: charging.plan
    contract:
      version: 2
      revision: '1'
      effect: information_task
      parameters:
        destination:
          type: string
          unit: ''
          region: ''
        soc:
          type: string
          unit: ''
          region: ''
      additional_parameters: legacy
      applicability:
        status: unspecified
        vehicle_models: []
        software_versions: []
      preconditions:
      - handler
      - permission
      idempotency: unknown
      verification: none
    # 能力效果（评审 W11）：改变世界 / 建了记录 ⇒ write；未声明的按纯查询处理。声明在这里，中央只消费（W07 任务帧 kind、终态账本）。
    effect: write
    description: 规划车辆长途充能策略（沿途分段充电）；**只出补能建议卡、不发起导航**，
      因此「先不要启动导航／先别导航」这类对执行方式的限定与本能力相容，照常规划
    # 2026-08-14 摘除死槽位 departure_time：声明以来 _plan 从未消费（B4 纪律），
    # 出发时刻规划是另一道题（EVA 二轮 G1 的 arrive_by 落在 navigation），有真需求再声明。
    slots: [destination, soc]
    heavy: true    # 长途充能沿途分段规划 → 开思考+过程区
    examples: ["去杭州怎么充电", "帮我规划充电"]
  - intent: charging.status
    contract:
      version: 2
      revision: '1'
      effect: read
      parameters: {}
      additional_parameters: legacy
      applicability:
        status: unspecified
        vehicle_models: []
        software_versions: []
      preconditions:
      - handler
      - permission
      idempotency: unknown
      verification: none
    description: 仅承接明确询问车辆当前电量百分比、剩余续航或充电状态；补能求助不归此能力；
      没有询问词、只陈述电量耗尽时禁止归此能力
    slots: []
    examples: ["现在电量多少", "还能跑多远"]

requires_permissions: [location.read, navigation.control, network.external]
context_scopes: [location, vehicle_state]   # 按位置找站 + 按真实电量规划

# 确定性路由（R2.1；2026-07-27 eval_skills live 采样方差实证）：「去X怎么充电」「快没电了
# 找桩」是本域教科书形态，LLM@0.3 温度下偶发翻面到 nearby/导航——canonical 形态按惯例
# hint 钉死；paraphrase 泛化（「补个电」「电够不够」）仍由 skill 知识层（charging-strategy
# guide）承担。guard 互斥：plan 形态不吃 find 的「附近/就近」，find 形态不吃 plan 的
# 「怎么充/长途」与导航动词。
route_hints:
  # 2026-10-07：「换一个充电站」整句，规划器在 CA2-19 换站真栈 6 遍里 2 遍没给出换站路径——1 遍两次判「无需动作」落到闲聊，
  # 闲聊编了一句「已在路线中添加途经点」（零动作；执行声明闸只认带「为您」的声明，刻意不收无主句）；1 遍拆成改路线 + 找站 +
  # 导航到目的地三步，第一步撞高德并发限额。整句锚定落到 charging.find：有活动路线时它按换站判据改派导航原位换站，
  # 没有路线时照常找站。判据是 `runtime/charger_swap.asks_to_swap_charger` 的子集，`test_the_swap_hint_is_a_subset_of_the_predicate` 对账。
  # 2026-10-10：句首可带「那 / 那就 / 再」——无路线连着换的第三句「再换一个充电站」规划器调用超时、兜底判不受话，落成「没听清」。
  - pattern: '^\s*(?:那就?)?\s*(?:请|帮我|能不能|可以)?\s*再?\s*换(?:一个|一家|个|家|别的|个别的|另一个|另一家)?\s*(?:充电站|充电桩|快充站?|超充站?|地方充电)(?:吧|呢|啊)?\s*[。！!？?]?\s*$'
    intent: charging.find
    policy: replace
    priority: 125
  # 设备 guard 两条 hint 都要（2026-07-27 评审三批：「去露营手机怎么充电」「去露营怎么
  # 充电宝」会命中 plan 形态——SOC/充电词形对设备成立不分 plan/find）。
  # 【charging.plan 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 2 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '去([^，。！？]{1,12}?)(?:的路上)' 找回原块。
  # 【charging.find 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 4 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '(?:^(?:糟了|糟糕|哎呀|哎哟|完了|不好' 找回原块。
