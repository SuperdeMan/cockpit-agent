agent_id: deep-research
version: 0.1.0
display_name: 深度调研
category: ecosystem
trust_level: first_party
deployment: cloud
# 多视角子问题 + 有界并行迭代检索（Exa 18s）+ 分节接地合成（动态开思考更慢），给足 Execute 超时；
# < 90s 端到端窗口。这是超时上限（ceiling），不影响 info.search 单轮快查。
latency_budget_ms: 85000
fallback: chitchat

capabilities:
  - intent: research.run
    # 【历史约束已解除，M5 P2-D4】此处原写着「desc 刻意保持原句不加长」——因为 registry
    # 离线路由曾按「query 单字符 ∩ capability 文本」打分，文本每加长一分所有 query 的分
    # 都会涨（曾把「自驾游路线安排」从 trip-planner 吸过来）。那是**描述写法在为打分算法
    # 的缺陷让路，倒果为因**。打分已换成 bigram 重合 + 按 query 长度归一，与 hay 长度解耦；
    # 性质由 registry/tests/test_store_scoring.py::test_longer_description_does_not_steal_top1
    # 钉死。desc 现在可以按「怎么写最有助于 LLM 判别」来写。
    # 「勿把普通查询升级成调研」的边界仍由 planner prompt 深度判据 + info.search desc 承载。
    description: 对一个主题做深度调研——拆成多视角子问题、并行联网检索正文级资料、产出带引用的分节报告
      与一段式语音简报。用户说「深入调研/研究一下/全面对比/系统了解/深度分析 X」时走本能力；
      单轮快查仍走 info.search。
    slots: [query, topic, question]
    heavy: true    # 深度调研多轮检索+分节合成 → 开思考+过程区
    examples: ["深入调研一下固态电池现状", "帮我研究下理想i8的智驾方案", "全面对比一下增程和纯电",
               "系统了解下港股打新规则", "深度调研这家公司的基本面", "研究一下这个城市值不值得定居"]

  # M2 P0（Task Ledger 消费面）：后台异步深调研是分钟级长任务，用户要能问进度、能喊停。
  # 两条都从账本读事实后**确定性作答**，不进 LLM（任务状态是系统持有的事实）。
  - intent: research.status
    description: 查询后台深度调研任务的进度（还在查/查完了/中断了）。用户问「查得怎么样了/那个调研有结果了吗/
      还在查吗」时走本能力；不是发起新调研。
    slots: []
    examples: ["刚才那个调研查得怎么样了", "调研有结果了吗", "还在查吗", "后台那个任务什么进度"]

  - intent: research.cancel
    description: 停掉正在跑的后台深度调研任务。用户说「别查了/不用查了/取消那个调研/停下」时走本能力。
    slots: [query]
    examples: ["别查了", "不用查了", "取消那个调研", "停掉刚才那个调研", "调研不用继续了"]

# 确定性路由（R2.1）：弱 LLM 常把深度调研误路由成 info.search/chitchat（浅答）。
# 逐字迁移自原 planning._RESEARCH_RE / _RESEARCH_FOLLOWUP_RE（_ensure_research_step）。
# replace=命中即取代误规划为单步 research.run；query 传原话，Agent 拆多视角子问题。
route_hints:
  - pattern: '深入(调研|研究|分析|了解)|深度(调研|研究|分析)|全面(对比|了解|分析|梳理)|系统(地)?(了解|梳理|学习|分析)|调研一下|彻底(研究|搞懂|弄懂|了解)|好好(研究|调研)'
    intent: research.run
    policy: replace
    priority: 100
    slots: {query: "$text"}
  - pattern: '(展开|深入|详细|细说|细讲|多讲|多说)[^，。！？]{0,4}第\s*[一二两三四五六七八九十\d]+\s*[点节部条]|第\s*[一二两三四五六七八九十\d]+\s*[点节部条][^，。！？]{0,4}(展开|详细|深入|细说|细讲)|(这部分|那部分|这一?节|这点|这条|那条|这则|上面那?[点段节])[^，。！？]{0,4}(展开|详细|深入|再说|再讲|讲讲)'
    intent: research.run
    policy: replace
    priority: 100
    slots: {query: "$text"}

  # M2 P0：长任务的取消/查询。**pattern 刻意收窄**——「别查了」三字太泛，只在「整句就是它」
  # （前后仅语气词）或明确带「调研/研究」宾语时才认；guard 排除提醒/导航/日程等有自己
  # 取消语义的域，防把「取消那个提醒」抢过来。
  # 无宾语的「别查了」整句锚定：前缀只认引导词、尾部只认语气词——**实测教训**：
  # 原写法尾部放行 3 个任意字，把「别查天气了」也劫持成了取消调研（eval --dump 抓到）。
  - pattern: '^(那|那就|好了|好啦|行了|算了|先|现在|你|你就)?\s*(别|不用|不要|甭)\s*(再)?(查|调研|研究)了[吧呀啊哦嘛么]{0,2}$|(取消|停掉|停止|终止|中止|结束)[^，。！？]{0,4}(调研|研究|后台任务)|(调研|研究)[^，。！？]{0,4}(取消|停掉|停下|别查|不用查|不用继续|别继续)'
    intent: research.cancel
    policy: replace
    priority: 95
    guard: '提醒|闹钟|日程|待办|导航|路线|场景|模式|订单|支付|音乐|播放|空调|车窗'
    slots: {query: "$text"}

  - pattern: '(调研|研究|报告|后台任务)[^，。！？]{0,6}(怎么样了|怎样了|什么进度|多少进度|有结果|出结果|好了没|好了吗|完了没|完成了吗|查完了吗|查好了吗)|(刚才|之前|上次|那个|昨天)[^，。！？]{0,4}(调研|研究)[^，。！？]{0,6}(怎么样|进度|结果|完了|好了)|^(这个|那个|它|现在|你)?\s*还在查(吗|么|不|呢)?[吗呢啊]{0,2}$'
    intent: research.status
    policy: replace
    priority: 95
    guard: '提醒|闹钟|日程|待办|导航|路线|订单|支付|充电'
    slots: {}

requires_permissions:
  - network.external
  - location.read
edge_intents: []
context_scopes: [location, vehicle_state]   # 调研接地「我」：位置/电量作研究约束（P1 注入子问题）
