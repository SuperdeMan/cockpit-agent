[pytest]
# 口径机制化：不带 --import-mode=importlib 的裸 pytest 会因 agents/*/tests/test_agent.py
# 同名模块 collection error 截断整趟——读起来像只红一条，实际后面几千条根本没跑。
# 此前这条口径只活在 Makefile 与 AGENTS.md 文档里；写进 addopts 后裸 `pytest` 与
# `make test` 同口径，那个坑不再存在（「记错两次的差额，去把它消灭掉」同族处置）。
addopts = --import-mode=importlib

# 收集剪枝：这些目录永远没有 Python 测试（gen/ codegen 产物、models/ 本地模型、
# hmi/dashboard 前端、docs/proto/skills/deploy/certs 非代码面），默认递归只烧 collect 时间。
# 刻意用黑名单、不用 testpaths 白名单：新增顶层目录默认仍被收集——漏测方向 fail-closed。
# ⚠ 自定义即整体覆盖 pytest 默认值，故默认项（.* node_modules venv 等）必须带上。
norecursedirs = .* *.egg venv build dist node_modules __pycache__ gen models certs deploy docs proto skills hmi dashboard
