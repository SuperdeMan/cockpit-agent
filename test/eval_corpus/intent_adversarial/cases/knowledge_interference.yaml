schema_version: 1
# A7 知识与规则干扰：Skill / Exemplar / Route Hint 的误召回、覆盖与预算裁剪。
#
# `required_skills` 判的是**真的注入了**——被预算裁掉（`!clipped`）不算命中，它压根
# 没进 prompt。`forbidden_skills` 判的是**没去干扰不相干的句子**：一条领域 guide 被
# 裸问天气召回，本身就是知识层在制造噪声。
#
# 这一类同时声明 l0 与 l1：检索是确定性的（词法档零网络），落域要模型。两层的结论
# 不互相外推——「知识进去了」不等于「知识用对了」。
