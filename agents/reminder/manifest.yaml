agent_id: reminder
version: 0.1.0
display_name: 智能提醒
category: core
trust_level: first_party
deployment: cloud
latency_budget_ms: 8000     # 常规确定性解析毫秒级；LLM 兜底解析一跳 @fast 留余量
fallback: chitchat

capabilities:
  - intent: reminder.create
    description: 创建定时提醒、位置提醒或待办。支持绝对时间（明天早上八点/周五下午三点）、
      相对时间（半小时后/20分钟后）、重复（每天/每个工作日/每周X）；**到某地/离开某地
      触发的位置提醒**（到公司提醒我拿文件）；只说"记一下"不带时间则存为待办；
      到点后说"过10分钟再提醒我"直接改期原条目（snooze）。
    slots: [title, time_text, kind]
    examples: ["明天早上八点提醒我带充电线", "半小时后提醒我给客户回电话",
               "周五下午三点叫我去接孩子", "记一下要买牛奶", "帮我记个待办周末洗车",
               "每天早上八点提醒我吃药", "过10分钟再提醒我",
               "到公司提醒我拿文件", "到家提醒我收快递", "离开公司提醒我买菜"]
  - intent: reminder.list
    description: 查询提醒/待办/日程安排（今天/明天/后天/未来三天/这周/全部/待办）
    slots: [scope, date_text]
    examples: ["我今天有什么安排", "我有哪些提醒", "看看我的待办", "明天有什么提醒",
               "这周有什么安排", "未来三天有什么提醒"]
  - intent: reminder.complete
    description: 完成某条提醒/待办（按序号或内容）
    slots: [index, title]
    examples: ["完成第二条", "买牛奶那条办完了", "标记第一个完成", "完成提醒：给客户回电话"]
  - intent: reminder.cancel
    description: 取消某条提醒，或清空全部（清空需二次确认）
    slots: [index, title, all]
    examples: ["取消第二条提醒", "不用提醒我回电话了", "把提醒都清空"]
  - intent: reminder.update
    description: 修改某条提醒的时间（改到/推迟/提前/换个时间）；按标题或"第N条"定位，
      缺新时间会追问后续接
    slots: [index, title, time_text]
    examples: ["把接孩子改到五点", "买牛奶那条推迟到明天九点", "改第二条到晚上八点",
               "带充电线的提醒改个时间"]

# 确定性路由（R2.1）：弱 LLM 常把"提醒我X"落到 chitchat。guard 排除车辆功能语境的
# "提醒"（限速/车道/碰撞等设备对象词，见 orchestrator/edge/fast_intent.py:1090）与
# 说明书查询（"限速提醒是什么"归 manual）。pattern 为设计 §6.2 方向性草案，以
# test/eval_corpus/route_hints_cases.yaml 实测收敛（Task 10）。
route_hints:
  # guard 的回忆/疑问式排除（R4，旅程 B5-1 真栈抓到）：「我刚才让你提醒我什么来着」是
  # 在**问**之前的提醒，不是建新提醒——没有排除会把问题本身当标题建单，还覆盖在挂的
  # REMINDER_PENDING。「让你提醒|提醒过」同族；不排「提醒我什么时候」（那是真创建）。
  - pattern: '提醒我|叫我(?!.{0,4}(小舟|什么))|别忘了|帮我记(一?下|个)|记个待办|设个提醒'
    intent: reminder.create
    policy: replace
    priority: 56
    # 条件句（要是/如果…就提醒我）是「查询→按结果决定」的 adaptive 任务（R6，旅程 A1-4）：
    # 整句 replace 会把条件吞成标题直接建单反问时间——让给 LLM 规划走 T2。
    # 2026-07-27（eval_skills live holdout 抓到）：不带「要是/如果」的条件形态同族——
    # 「看下明晚会不会下雨，要下就叫我收衣服」被「叫我」劫持成直接建单，把 LLM 规划对的
    # 查询步整句踩掉（比无知识档还差）。补查询式前置标记：会不会/有没有/下不下。
    guard: '限速|车道|碰撞|疲劳|盲区|导航播报|电量提醒|保养提醒|是什么|怎么(开|关|用)|什么意思|什么来着|让你提醒|提醒过|要是|如果|假如|万一|会不会|有没有|下不下'
    slots: {title: "$text"}
  # 【reminder.list 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 4 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '我(今天|明天|后天|这周|未来.{0,2}天)' 找回原块。
  # 【reminder.cancel 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 4 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '(取消|删掉|删除|不用).{0,4}(提醒|待' 找回原块。
  # 【reminder.update 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 4 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '(改到|改成|推迟到|提前到|延到|换到)\s*' 找回原块。
  # 【reminder.complete 的 route_hint 已于 2026-07-29 退役】判据：双臂裸跑
  #   deepseek:deepseek-v4-flash / minimax:MiniMax-M3 各 ×2 轮，其 2 条命中语料**全覆盖**
  #   （非抽样——抽 3 句会系统性高估，命中面越大的规则越容易被放行）；
  #   摘掉它之后仍全部落对 → 模型 + 范例已经自己会了。
  #   ⚠ 证据只覆盖上述两档。本 hint 家族当初是为 **MiMo** 写的
  #     （route_hints.py 开篇：「弱 LLM（MiMo）常漏/误路由」），而本环境
  #     MiMo 无可用 key（探针 all models failed），**切回 MiMo 须复验**。
  #   回归保护未删：命中句已改端到端口径迁入 mode_routing_cases.yaml。
  #   要恢复：git log -S '(完成|办完|做完|搞定)了?.{0,4}(第[' 找回原块。
requires_permissions:
  - profile.read        # 提醒属用户数据域 + shared_state 经 profile KV；不新增 scope
  - profile.write
edge_intents: []
# M3 P1 位置提醒：围栏判定读的是 NATS 车况广播的 location（不是 meta 下发），
# 但创建期解析地点要按当前位置搜 POI，故声明 location。
context_scopes: [location]
