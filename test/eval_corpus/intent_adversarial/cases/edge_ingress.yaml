schema_version: 1
# A6 Edge 误接与漏接：本地能力、在线能力、二者组合、危险动作、非受话文本。
#
# gold 按**架构要求**写，不按当前实现抄：
# - 对象完整的确定性车控/媒体 → `edge_local`（端侧秒回，离线也要能用）；
# - 危险动作（后备箱/车门锁/充电口/油箱盖）**不得在端侧先执行**，必须上云走确认闸；
# - 在线信息 → `cloud`；本地 + 在线组合 → `mixed`（端侧做本地那半，其余上云）。
#
# 这一层不判计划：计划要模型才知道。它判的是**这句话有没有走对入口**，以及
# **确认前有没有产生副作用**。
cases:
