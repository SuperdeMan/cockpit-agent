  # ── 终止 vs 增量调整（navigation.cancel，2026-08-19 卡 Q8 / I-017）────────
  # 同批把裸取消判据收窄之后（`pending_cancel._no_substance_left`），「取消导航」
  # 不再被前置闸当成「取消挂起」吞掉——**放开一条路却不给它落点，是把一个错换成
  # 另一个错**，所以这五条与那次收窄是同一笔改动的两面。
  # 判据是**终止还是调整**：cancel 结束这一趟，reroute 改这一趟（删途经点/换路/改目的地）。
  # 两侧都要锁：只锁左边会让「换条路」也被兑现成结束导航，那比答非所问更糟。
  - id: tu.nav.cancel-route
    title: 取消当前导航（终止）
    family_id: tu.nav-cancel-vs-reroute
    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A2], mechanisms: [object_flip], domains: [navigation], layers: [l1]}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-19}
    turns:
      - input: {utterance: 取消导航, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [navigation.cancel]}], forbidden_intents: [navigation.reroute, navigation.navigate_to, navigation.estimate], allow_extra_intents: false}
