    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A3], mechanisms: [clarify], domains: [navigation], layers: [l1]}
    provenance: {kind: authored, reviewed_by: human, reviewed_at: 2026-08-02, gold_revision_reason: "2026-08-02 复核：CLARIFY_ENABLED **生产一直是 on**（.env.example / compose 自 2026-07-08 真栈 CDP 验收后即 on），findings 里「生产默认 off」读的是代码兜底值；本批已把 planning/engine 的兜底缺省对齐到 on，评测进程不再测到另一套装配", gold_revised_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-03, stabilized_via: evidence_only, evidence_report: "docs/reviews/eval/_ci-run-intent-gate-promotion-{a,b}.json"}
    turns:
      - input: {utterance: 华润大厦, context: {}}
        expected:
          decision: {allowed: [clarify], clarify: required}
          plan: {required_intent_groups: [], forbidden_intents: [navigation.navigate_to], allow_extra_intents: false}
  - id: nq.landmark.explicit
    title: 补上动词后必须直接执行
    family_id: nq.landmark
    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A3], mechanisms: [clarify], domains: [navigation], layers: [l1]}
    # 2026-08-02 泓舟裁定：带「导航去/带我去」的句子归 navigation 域；**先搜后导与直接导航
    # 两条 intent 都算落对**（用户拿到的都是「去这个地方」）。本条真正要守的是另一件事：
    # 补上动词之后**绝不许再反问**——澄清只作用于动词缺失的裸地名。
    #
    # ⚠ **这一条本身没有缺陷，是被 relation 连累的**（2026-08-10 立卡）：四次 10 样本里
    # 它自己每一条断言都过（decision=execute、clarify=False、navigate_to 在场、无额外项），
    # 却因 `clarify_flip` 要求 base **稳定** clarify 而全部记红。
    # 判据：**relation 断言会把 base 的方差放大成 variant 的稳定红**——同一个缺陷被计两次，
    # 还把一个 unstable 记成 stable_fail。它随 base 一起降级，等 base 有解再一起回池；
    # 契约本来也不允许 base 非 stable 而 variant 是 stable。
    provenance: {kind: authored, reviewed_by: human, reviewed_at: 2026-08-02, gold_revision_reason: "2026-08-02 裁定：navigate_to 与 search_poi 都算落对；断言收敛到「补上动词后不得澄清」", gold_revised_at: 2026-08-02, stabilized_provider: "minimax:MiniMax-M3", stabilized_at: 2026-08-03, stabilized_via: evidence_only, evidence_report: "docs/reviews/eval/_ci-run-intent-gate-promotion-{a,b}.json"}
    relation: {base_case: nq.landmark.bare, type: clarify_flip, expectation: {}}
    turns:
      - input: {utterance: 导航到华润大厦, context: {}}
        expected:
          decision: {allowed: [execute], clarify: forbidden}
          plan: {required_intent_groups: [{any_of: [navigation.navigate_to, navigation.search_poi]}], allow_extra_intents: false}
