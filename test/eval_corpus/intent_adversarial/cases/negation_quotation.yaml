schema_version: 1
# A3 否定、条件、时态与引用：不/别/取消/如果/之后/刚才/最新，以及被引号或转述包裹的命令。
#
# 这一类的核心断言是 **forbidden**：被否定或被引用的那个动作**不得出现在计划里**。
# 只写 required 的用例在这里毫无价值——「多做了一件用户明确说不要的事」正是它要抓的。
cases:
  - id: nq.umbrella.both
    title: 查天气并提醒带伞
    family_id: nq.umbrella
    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A3], mechanisms: [negation_scope], domains: [info, reminder], layers: [l1], gate_candidate: true}
    provenance: {kind: authored, reviewed_by: human, reviewed_via: blanket_authorisation, reviewed_at: 2026-08-02}
    turns:
      - input: {utterance: 帮我查下明天的天气，然后提醒我带伞, context: {}}
        expected:
          plan: {required_intent_groups: [{any_of: [info.weather, info.forecast]}, {any_of: [reminder.create]}], allow_extra_intents: false}
  - id: nq.umbrella.negated
