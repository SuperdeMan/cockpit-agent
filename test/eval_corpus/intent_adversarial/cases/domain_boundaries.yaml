schema_version: 1
# A1 跨域词义碰撞：相似能力描述、共享问句框架、设施发现边界。
#
# 18 条 `skills/exemplars/boundaries.yaml` 台账裁定各出 4 条（左/右 × seen/unseen），
# 每一侧都必须 **required 本侧 + forbidden 对侧**——只写 required 的用例证明不了边界，
# 它连对侧被误选都不会红。seen 用台账原句（已进范例库），unseen 用同义新句且**另立
# family**，防止拿修复原句自证泛化。
#
# seen 与 unseen 各自成一对 route_flip 最小对照：同一个问句框架、只换对象，落域必须翻。
