  # 2026-08-01 移出 nightly：本脚本每一轮都要求规划落到 trip-planner，而 nightly 是
  # **mock 全栈**——MockProvider 只回显原话，规划必然走 `_fallback` 而 `_fallback` 优先
  # 兜底到 chitchat。它此前之所以能过，全靠 `trip.plan/.navigate/.status/.modify` 四条
  # route_hints 在 LLM 之后 replace 整条计划；那四条已于 2026-07-29 按跨 provider 双臂
  # 证据退役（M5 P2）。**也就是说这个脚本在 mock 车道里测的一直是正则，不是系统。**
  # 判据（随本次收窄入册）：**mock-safe 的条件是「这条路径不经过模型判断」**
  # ——端侧快路径 / 兜底 Agent / 确定性时间解析 / 协议层——**不是「有没有 hint」**。
  # 覆盖去向：milestone 车道（真 provider）仍跑全量；不恢复 hint（那是把规则工厂请回来）。
