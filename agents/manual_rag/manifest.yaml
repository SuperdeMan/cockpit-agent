agent_id: manual-rag
version: 0.3.0
display_name: 车书助手
category: ecosystem
trust_level: first_party
deployment: cloud
latency_budget_ms: 2500
fallback: chitchat

capabilities:
  - intent: manual.query
    response_only: true
    description: 车型使用手册问答（胎压、保养、充电、功能操作等），基于车型知识库检索作答
    slots: [question]
    examples: ["胎压多少正常", "怎么开启自动泊车", "多久保养一次", "怎么连CarPlay",
               "雨刮器怎么打开", "仪表上这个故障灯是什么意思",
               "小人背着宝剑的灯亮了是怎么回事"]

# 生产 MiniMax 在 2026-09-03 将“雨刮器怎么打开？”与“背宝剑的小人灯”都规划成
# chitchat.talk。这里用 Agent 自声明的窄领域 hint 兜底；编排核心不新增 manual 字面量。
# 第一条只接车辆部件/功能的“操作方法”句形，明确执行命令没有“怎么/如何”不会命中；
# 第二条只接仪表/状态栏里的灯和图标/胎压处置，用户上传照片的识别请求由 guard 让给 vision；
# 后三条是 2026-09-03 f2dcb46 真栈 36 题复现后的窄 canonical：车型规格与维护、当前车
# 兼容性、车内 SOS。它们不收编实时车况、设备兼容性、手机求救或研究类话题。
route_hints:
  - pattern: '(?:(?:雨刮(?:器|片)?|雨刷|自动泊车|代客泊车|充电口(?:盖)?|前备箱|后备箱|车载冰箱|空调滤芯|空调滤网|安全带|安全气囊|轮胎|胎压|除雾|风挡洗涤|后视镜|车窗|天窗)[^，。！？!?]{0,12}(?:怎么|咋|如何)(?:才|才能|可以|应该|要|去)?(?:打开|开启|关闭|关掉|使用|操作|进入|连接|设置|更换|启动|停用|换|开|关)|(?:怎么|咋|如何)(?:才|才能|可以|应该|要|去)?(?:打开|开启|关闭|关掉|使用|操作|进入|连接|设置|更换|启动|停用|换|开|关)[^，。！？!?]{0,12}(?:雨刮(?:器|片)?|雨刷|自动泊车|代客泊车|充电口(?:盖)?|前备箱|后备箱|车载冰箱|空调滤芯|空调滤网|安全带|安全气囊|轮胎|胎压|除雾|风挡洗涤|后视镜|车窗|天窗))'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:(?:帮我|替我|给我|麻烦|现在|马上|立刻)\s*(?:把|将)?\s*(?:雨刮|雨刷|车窗|天窗|后视镜|前备箱|后备箱|空调)|(?:手机|电脑|平板|耳机|软件|应用|APP|App).{0,10}(?:怎么|咋|如何))'
    slots: {question: "$text"}
  - pattern: '(?:(?:仪表|仪表屏|中控屏|状态栏)[^，。！？!?]{0,24}(?:灯|图标)[^，。！？!?]{0,20}(?:亮|闪|常亮|代表|含义|意思|怎么回事)|(?:故障灯|警告灯|指示灯)[^，。！？!?]{0,20}(?:亮|闪|常亮|代表|含义|意思|怎么回事)|胎压(?:监测)?(?:报警|异常)[^，。！？!?]{0,12}(?:怎么办|怎么处理|如何处理|怎么处置|如何处置|还能开|继续开)|机油灯[^，。！？!?]{0,8}(?:亮|闪|常亮)[^，。！？!?]{0,12}(?:怎么办|怎么处理|如何处理|怎么处置|如何处置))'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:照片|图片|画面|摄像头|拍一下|拍照|帮我看(?:看)?这个)'
    slots: {question: "$text"}
  - pattern: '(?:(?:充电上限|充电限值)[^，。！？!?]{0,12}(?:多少|多高|合适|建议|推荐|怎么设|如何设)|(?:三元锂|磷酸铁锂)(?:离子)?电池[^，。！？!?]{0,16}(?:充到|充至|充电上限)[^，。！？!?]{0,8}(?:多少|几成|合适)?|(?:冬天|冬季|低温|冰雪)[^，。！？!?]{0,12}(?:轮胎|车胎)[^，。！？!?]{0,12}(?:要求|注意|怎么选|如何选|要不要换|更换)|防滑链[^，。！？!?]{0,8}(?:应该|该|要|需要|怎么|如何)[^，。！？!?]{0,8}(?:装|安装|套)[^，。！？!?]{0,12}(?:哪个|哪边|哪侧|前轮|后轮|轮子)|(?:空调滤芯|空调滤网|雨刮片|制动液|刹车油|发动机机油|机油)[^，。！？!?]{0,12}(?:怎么|咋|如何|多久|几年|周期|更换|换)|(?:SU7|小米SU7)[^，。！？!?]{0,12}(?:发动机)?排量[^，。！？!?]{0,8}(?:多少|多大|是什么|有没有)?)'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:研究|调研|论文|新闻|行业|技术原理|手机|电脑|平板|耳机)|(?:(?:帮我|替我|给我|现在|马上|立刻)\s*(?:把|将)?.{0,12}(?:设成|设为|设置为|更换|换掉|装上))'
    slots: {question: "$text"}
  - pattern: '^\s*(?:(?:SU7|小米SU7|本车|这车)\s*)?(?:支持|兼容|能不能用|可不可以用|有没有)(?:\s*Apple)?\s*(?:CarPlay|Android\s+Auto|CarLink)\s*(?:吗|呢|么|[？?])?\s*$'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:手机|电脑|平板|哪些(?:车|车型)|什么(?:车|车型)|列表|品牌)'
    slots: {question: "$text"}
  - pattern: '(?:(?:紧急情况|发生事故|车辆遇险|车内遇险)[^，。！？!?]{0,8}(?:怎么|咋|如何|怎样)(?:在车内)?(?:呼叫|联系|发起)(?:道路)?救援|(?:车顶|车内|车辆)[^，。！？!?]{0,10}SOS[^，。！？!?]{0,10}(?:怎么|如何|使用|呼叫|求救))'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:手机|电话|报警电话|拨打|110|120|119)'
    slots: {question: "$text"}

requires_permissions: []
edge_intents: []
