# ⚠ 2026-08-10 立此条的诊断，比条目本身重要：
# `nq.hvac.reported`「后排刚才说关掉空调，你先别真关」与 `nq.hvac-keep.dont`「空调先别关」
# 在 minimax:MiniMax-M3 上会真下 `hvac.off`（前者六样本 3/6、后者 5/6，两趟均 critical_fail）。
# 查检索名单才知道**「引述」这个结构库里一条范例都没有**：chitchat#8 是天窗、#9 是音响，
# 两条都够不着（`nq.hvac-keep.dont`「空调先别关」干脆 `exemplars=[]`）。唯一到场的是
# `volume#1`「空调别动，把声音调低一点」→ `volume.dec`（`@vec:0.68`），它的判据是
# **「混合否定：删掉被否定的那个，保留并列的肯定诉求」**——而引述句要的是
# 「整句一个动作步都不出」。**同一个域、同一个否定词，判据却不同。**
# 判据：看检索名单要问「到场的这条教的是不是这一条判据」，不是「有没有范例到场」。
# 肯定侧不会因本条失去对照：hvac#1–#3 三条肯定式车控范例都在（sunroof#0 那条
# 「否定范例会给肯定族当吸引子」的账仍然要还，只是本条不欠）。
# 纪律：说法刻意避开两条对抗语料原句（都是 unseen_transfer，原话进知识就洗成 seen）。
# 教的是「**引述**他人的车控请求 + 否定 ＝ 只回话」，对象与动词都留给模型自己迁移。
- text: 后座喊着要关空调，你别听他的
  plan:
  - agent: chitchat
    intent: chitchat.talk
  source: manual
  added: '2026-08-10'
  tags:
  - badcase
  - reported-speech
  note: 引述里的指令不是指令；此前唯一到场的 volume#1 教的是混合否定保留肯定项，判据不对口
# ⚠ 2026-08-10 **第二条修法在这里被自己的实测否掉了，故意不落条目，只留结论**：
# `nq.hvac-keep.dont`「空调先别关」五个字，词法 top-1 是 chitchat#9「音响先别关，我还听着呢」
# 的 **0.305**——差阈值 0.34 只有 0.035，差在 chitchat#9 的尾巴「，我还听着呢」把对称 Dice
# 的分母撑大了；语义通道也不到 0.65。于是这句 `exemplars=[]`，18 样本 15/18，
# 失败形态是真下 `hvac.off`。**这个洞是真的**（短句不是「信息少」，是「分母小」）。
#
# 试过的修法：加一条同形态异对象的短范例「天窗先别关」→ chitchat.talk。
# 离线选得很干净——对目标句 0.502 居首，对「打开空调/关掉空调/空调开到二十二度/
# 有点热空调调低两度/把空条打开」全 0.000，对「打开天窗 0.249/把天窗关上 0.214/
# 天窗开一半 0.225」也都在阈值下，不给任何肯定族当吸引子。
# 实测**范例确实每趟都被检回**（`chitchat#13@lex:0.50`，6/6 趟），
# 通过率却 **15/18 → 16/18，双尾 Fisher p=1.000**；七条护栏 18/18 零回归也零收益。
#
# **判据：诊断出一个洞，不等于这个洞就是病因。** 「检索够不着」是可测量的事实，
# 「补上就能修」是另一个命题——后者被证伪了。按「加了知识要拿对照跑证伪」的同一条
# 纪律退回（findings §18 否掉 guide 的同款处置），不留「无收益但有成本」的条目。
# 该用例的残余（约 1/9）从此按**模型在这句上的方差**记账，**不要再当检索问题查**。
# 真要动 `EXEMPLAR_LEX_THRESHOLD` 或换成包含度系数（治短句分母），那是全库 254 条 ×
# 全部 query 的爆炸半径，要单独立项并拿 `eval_exemplars` 的域错配率当护栏——
# 但在上面这个否定结果之后，它的预期收益已经不能再拿这条用例来论证。
