agent_id: navigation
version: 0.1.0
display_name: 导航助手
category: core
trust_level: first_party
deployment: cloud
# navigate_to/search_poi 走高德 + 视觉地标 LLM 解析（像笋→中国华润大厦，走 @fast 快模型）+ name_matches
# 校验；多意图并发下 navigate 与多个 nearby 搜索一起挤高德免费档 QPS、重试退避拖慢，5s→20s 容纳。
latency_budget_ms: 20000
fallback: chitchat

capabilities:
  # 判别化（2026-07-30 地盘收口）：原描述「按关键词/类别/位置搜索 POI（餐厅、充电站、
  # 加油站、停车场等）」与 nearby.search 几乎逐字重叠——两个等价工具摆在 planner 面前，
  # 它只能掷硬币，于是 nearby 的两条 replace 正则被拉来当裁判（M5 P2 双臂裸跑坐实）。
  # 判据换成产出形态：本条**定位一个可导航的目标**，nearby.search **列多个候选让用户挑**。
  - intent: navigation.search_poi
    description: 把一个说法解析成**一个可导航的具体地点**——按名（含官方名/别名）或视觉地标
      描述定位（「像笋一样的大楼」→中国华润大厦），命中即可直接规划路线；也承接多意图里
      「导航去X + 顺路找Y」的子步与加油站/服务区这类沿途设施。用户**已经知道要去哪**时用
      本条；「看看附近有什么」式的多候选发现与比较（餐饮/酒店/景点/影院/停车场/超市）归
      nearby.search，找充电桩归 charging.find（它按真实电量与空闲状态排序）
    slots: [keyword, category, near, rating_min]
    examples: ["最近的加油站在哪", "去深圳像笋一样的那栋大楼", "国贸三期在哪个位置"]
  - intent: navigation.navigate_to
    description: 导航到指定目的地；支持常用地点别名（家/公司/学校，未设置会反问地址并记住）、
      顺路停靠（stop_category=吃饭/咖啡…→给沿途候选让用户选）、带途经点（waypoint=已选停靠
      点名，多个用顿号连写）。「X点前到/别迟到」这类到达时限把时间原话填 arrive_by（会核对
      预计到达并给出发提醒）；「不走高速/避堵/少收费/走风景好的路」填 route_pref（按策略规划）
    slots: [destination, origin, stop_category, waypoint, place_address, arrive_by, route_pref]
    examples: ["导航去公司", "带我去首都机场", "回家", "导航去东方之门，附近找个吃饭的地方",
               "导航去东方之门途经肯德基", "去接孩子放学，五点前要到学校", "不走高速送我去机场",
               "从深圳欢乐海岸出发去世界之窗"]
  # 2026-08-19（QA 卡 Q8 / I-016）：能力面原本只有「导航过去」，于是「从A到B多远多久」
  # 被 planner 就近挑成 navigate_to **真的开始导航**（真栈实测发出 navigate、答「全程约21
  # 公里」并前往）。判据是**用户要的是数还是行程**——这两件事在能力面上必须分开，
  # 否则一个纯查询会产生不可逆的副作用（同 Q8 卡的「就近误执行」形态）。
  - intent: navigation.estimate
    description: 只算不导——回答「从A到B多远/多久/几点能到」，给出里程、驾车时长
      与预计到达时刻，**不启动导航、不发车控动作**。起点默认当前位置，用户明说
      「从X出发/从X开到Y」时填 origin。用户说「导航去/带我去/走吧/出发」这类**要动身**
      的话归 navigation.navigate_to；本条只回答数字
    slots: [destination, origin, route_pref]
    examples: ["从深圳市民中心到深圳北站开车大概多远、要多久", "到公司还有多远",
               "从家开到宝安机场大概要多久", "去趟世界之窗多长时间"]
  - intent: navigation.reroute
    description: 增量调整**当前正在进行的这次导航**（对话焦点里有「当前正在导航」时用本条）——
      去掉/加上途经点（「肯德基不去了」「顺路加个加油站」，remove_waypoint/add_waypoint）、
      换条路（「换条避堵的路」，route_pref）、改目的地（「改去COCO Park」，destination）；
      未点名的目的地/时限/其余途经点全部保持。多日行程或「第N天」停靠点的增删改归
      trip.modify，本条只管这一趟在开的路线
    slots: [remove_waypoint, add_waypoint, destination, route_pref]
    examples: ["刚才那个途经点不去了", "换条路走", "咖啡不买了，先去加油站，别迟到",
               "顺路再加个超市", "目的地改成宝安机场"]
  # 2026-08-19（QA 卡 Q8 / I-017）：**终止**当前导航，与 reroute 的「增量调整」不是
  # 一件事。补它的直接原因有两条：① I-017 现象是「说了取消，屏幕上那条路线还在」；
  # ② 同批把裸取消判据收窄之后（`pending_cancel._no_substance_left`），
  # 「取消导航」不再被前置闸当成「取消挂起」吞掉，**它必须有一个落点**——
  # 放开一条路却不给它落点，是把一个错换成另一个错。
  - intent: navigation.cancel
    description: 结束/取消**当前正在进行的这次导航**（「取消导航」「别导了」「不去了」
      在有活动路线时）。它是终止不是调整——删途经点/换路线/改目的地归 navigation.reroute；
      没有正在进行的导航时诚实说明，不当作取消待确认操作
    slots: []
    examples: ["取消导航", "结束导航", "别导航了", "不用导航了", "退出导航"]
  - intent: navigation.set_place
    description: 设置常用地点（家/公司/学校）的地址，记住后可直接『导航去家/公司』。只记录不导航。
    slots: [place, address]
    examples: ["把家设成上海长宁区某某小区", "我家在深圳南山区科技园", "设置公司地址为北京国贸三期", "公司在杭州西湖区某某大厦"]
  - intent: navigation.reverse_geocode
    description: 逆地理编码，根据给定坐标(lng/lat)获取地址信息
    slots: [lng, lat]
    examples: ["这个坐标是什么地方", "121.47,31.23是哪里"]
  - intent: navigation.locate
    description: 回答用户"我在哪/我现在在哪里/当前位置"，对当前已授权定位做逆地理编码给出当前所在地址。无具体坐标，用当前位置。
    slots: []
    examples: ["我在哪", "我现在在哪里", "我现在在哪", "当前位置", "我在什么地方", "这是哪里"]
  - intent: navigation.poi_detail
    description: 查询某个 POI 的详细信息
    slots: [poi_id]
    examples: ["这个地方的详细信息", "查一下这个地点"]

# 2026-08-24 QA PU5/PU6：MiniMax 重复采样仍会把「接人 + 顺路办事」整句吞进商户或
# 提醒域，导致主导航消失。这里声明的是结构化语义边界（明确接/送亲属 + 明确顺路词 +
# 有界停靠类别），不是逐句补丁；只有 navigation Agent 声明自己的窄语法，执行仍走
# navigate_to 的人员解析、路线规划、候选选择与 VAL 边界。否定、提醒、疑问和设备句不接管。
route_hints:
  # PU1/PU2：短句「去接我爸/老婆」语义已经闭合，却在长会话里随机漂到 set_place 或
  # chitchat。整句锚定，只接受接送+亲属；提醒、否定、问法与带后续目的地的复合句均不命中。
  - pattern: '^\s*(?:带我去|先去|去)?\s*(?:接|送)\s*(?:我(?:的)?)?\s*(孩子|女儿|儿子|爸妈|父母|妈妈|爸爸|妈|爸|老婆|老公|妻子|丈夫)(?:放学|下班|上学)?[。！？!?]?\s*$'
    intent: navigation.navigate_to
    policy: replace
    priority: 128
    guard: '(?:别|不要|不用|取消|提醒|闹钟|待办|为什么|怎么|是否|手机|电脑|设备|音量)'
    slots: {destination: "$1"}
  - pattern: '^\s*(?:带我去|先去|去)?\s*(?:接|送)\s*(?:我(?:的)?)?\s*(孩子|女儿|儿子|爸妈|父母|妈妈|爸爸|老婆|老公|妻子|丈夫)(?:放学|下班)?[^。！？!?]{0,18}(?:顺便|顺路|顺道|路上|沿途|途中|中途)\s*(?:帮我|给我)?\s*(?:找(?:一|1)?家|买(?:一|1)?(?:杯|份)?|去(?:一|1)?家?|吃(?:一|1)?(?:顿|家)?|喝(?:一|1)?杯|取(?:一|1)?份?|停(?:靠|一下)?(?:在)?)\s*[^。！？!?]{0,6}(麦当劳|咖啡(?:店|馆)?|奶茶|餐厅|饭店|美食|川菜(?:馆)?|火锅|小吃|加油(?:站)?|充电(?:站)?)(?:\s*[，,]\s*(?:今天|明天)?\s*\d{1,2}点(?:半)?\s*(?:前|左右)?\s*(?:我要|要)?\s*(?:到|抵达)[^，,。！？!?]{0,8})?[。！？!?]?\s*$'
    intent: navigation.navigate_to
    policy: replace
    priority: 127
    guard: '(?:别|不要|不用|取消|提醒|闹钟|待办|完成|为什么|怎么|是否|手机|电脑|设备|音量|播放|放歌|听歌|音乐|歌曲)'
    slots: {destination: "$1", stop_category: "$2"}

requires_permissions:
  - location.read
  - navigation.control
edge_intents: []
context_scopes: [location]   # 按需下发精确位置（最小化）
