agent_id: manual-rag
version: 0.2.0
display_name: 车书助手
category: ecosystem
trust_level: first_party
deployment: cloud
latency_budget_ms: 2500
fallback: chitchat

capabilities:
  - intent: manual.query
    response_only: true
    description: 车型使用手册问答（胎压、保养、充电、功能操作等），基于车型知识库检索作答
    slots: [question]
    examples: ["胎压多少正常", "怎么开启自动泊车", "多久保养一次", "怎么连CarPlay",
               "雨刮器怎么打开", "仪表上这个故障灯是什么意思",
               "小人背着宝剑的灯亮了是怎么回事"]

# 生产 MiniMax 在 2026-09-03 将“雨刮器怎么打开？”与“背宝剑的小人灯”都规划成
# chitchat.talk。这里用 Agent 自声明的窄领域 hint 兜底；编排核心不新增 manual 字面量。
# 第一条只接车辆部件/功能的“操作方法”句形，明确执行命令没有“怎么/如何”不会命中；
# 第二条只接仪表/状态栏里的灯和图标，用户上传照片的识别请求由 guard 让给 vision。
route_hints:
  - pattern: '(?:(?:雨刮(?:器|片)?|雨刷|自动泊车|代客泊车|充电口(?:盖)?|前备箱|后备箱|车载冰箱|空调滤芯|空调滤网|安全带|安全气囊|轮胎|胎压|除雾|风挡洗涤|后视镜|车窗|天窗)[^，。！？!?]{0,12}(?:怎么|咋|如何)(?:才|才能|可以|应该|要|去)?(?:打开|开启|关闭|关掉|使用|操作|进入|连接|设置|更换|启动|停用|开|关)|(?:怎么|咋|如何)(?:才|才能|可以|应该|要|去)?(?:打开|开启|关闭|关掉|使用|操作|进入|连接|设置|更换|启动|停用|开|关)[^，。！？!?]{0,12}(?:雨刮(?:器|片)?|雨刷|自动泊车|代客泊车|充电口(?:盖)?|前备箱|后备箱|车载冰箱|空调滤芯|空调滤网|安全带|安全气囊|轮胎|胎压|除雾|风挡洗涤|后视镜|车窗|天窗))'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:(?:帮我|替我|给我|麻烦|现在|马上|立刻)\s*(?:把|将)?\s*(?:雨刮|雨刷|车窗|天窗|后视镜|前备箱|后备箱|空调)|(?:手机|电脑|平板|耳机|软件|应用|APP|App).{0,10}(?:怎么|咋|如何))'
    slots: {question: "$text"}
  - pattern: '(?:(?:仪表|仪表屏|中控屏|状态栏)[^，。！？!?]{0,24}(?:灯|图标)[^，。！？!?]{0,20}(?:亮|闪|常亮|代表|含义|意思|怎么回事)|(?:故障灯|警告灯|指示灯)[^，。！？!?]{0,20}(?:亮|闪|常亮|代表|含义|意思|怎么回事))'
    intent: manual.query
    policy: replace
    priority: 124
    guard: '(?:照片|图片|画面|摄像头|拍一下|拍照|帮我看(?:看)?这个)'
    slots: {question: "$text"}

requires_permissions: []
edge_intents: []
