    title: 条件式提醒不得漏掉条件（首轮只查、看到结果再补提醒）
    family_id: nq.condition
    cohort: unseen_transfer
    risk: medium
    status: reviewed
    tags: {attacks: [A3], mechanisms: [conditional, adaptive], domains: [info, reminder], layers: [l1]}
    # gold 修订（2026-08-02）：原 gold 要求**首轮就同时出** info.weather + reminder.create，
    # 这与两处既有裁定直接冲突——① `skills/guides/conditional-reminder.yaml`（v2，live 验过）
    # 明确「条件依赖必须 adaptive：先只规划查询步，不要把 Y 无条件排进计划」，其 golden 就是
    # `expect_not: [reminder.create]`；② 同语料里 **stable** 的 `cp.adaptive.rain-umbrella`
    # 「明天要是下雨就提醒我带伞」写的正是「首轮只查 + replan 补提醒」。
    # 实测 planner 的 goal 写的是「查询明天天气，若下雨则创建带伞提醒」——**它做对了**，
    # 是尺子写反了。改法：按 cp.adaptive.rain-umbrella 的形态补上 replan 段，
    # 把「条件不许被漏掉」这个真主张断在**该断的地方**（replan 轮必须补出 reminder.create）。
    provenance:
      kind: authored
      reviewed_by: human
      reviewed_via: blanket_authorisation
      reviewed_at: 2026-08-02
      gold_revision_reason: >-
        原 gold 与 conditional-reminder guide 契约及 stable 案例 cp.adaptive.rain-umbrella
        自相矛盾（要求首轮无条件出 reminder.create）；按既有裁定改为 adaptive 两段式。
    turns:
      - input: {utterance: 如果明天下雨就提醒我带伞, context: {}}
        expected:
          plan:
            required_intent_groups: [{any_of: [info.weather, info.forecast]}]
            forbidden_intents: [reminder.create]
            allow_extra_intents: false
            complexity: {allowed: [adaptive]}
          replans:
            - after:
                result: {step_id: s1, status: ok, data: {condition: 小雨}, speech: 明天有小雨}
              plan:
                required_intent_groups: [{any_of: [reminder.create]}]
                allow_extra_intents: false
