schema_version: 1

# 只去掉问法壳，不删除“打开/关闭/更换”等决定答案的业务词。
query_noise_phrases:
  - 请问一下
  - 麻烦告诉我
  - 请告诉我
  - 我想知道
  - 用户手册里
  - 说明书里
  - 手册里
  - 推荐值是多少
  - 多少合适
  - 打到多少
  - 设置多少
  - 设多少
  - 打多少
  - 怎么办
  - 能不能
  - 可不可以
  - 请问
  - 一下
  - 怎么
  - 如何
  - 应该
  - 是否
  - 多久
  - 隔多长时间
  - 我从哪里
  - 做一次
  - 车子
  - 几年
  - 多少
  - 一次
  - 用户手册
  - 说明书
  - 手册
  - 本车
  - 我的车
  - 车辆
  - 汽车
  - 支持吗
  - 可以吗
  - 合适

# 口语 -> 手册用词。它是检索声明，不进入 Planner，也不改变答案事实。
aliases:
  标准胎压: [轮胎压力参数]
  推荐胎压: [轮胎压力参数]
  多久保养: [定期保养]
  多久换: [更换]
  几年换: [更换周期]
  换一次: [更换]
  装在哪个轮子上: [车轮 安装]
  制动系统故障灯亮了怎么办: [制动系统故障指示灯]
  制动故障灯亮了怎么办: [制动系统故障指示灯]
  胎压: [轮胎压力, 充气压力]
  轮胎气压: [轮胎压力]
  刹车油: [制动液]
  充到多少: [充电限值建议]
  打气: [充气]
  自动泊车: [智能泊车]
  充电上限: [充电限值建议]
  电池上限: [充电限值建议]
  保养周期: [定期保养]
  冬天: [冬季]
  空调滤网: [空调滤芯]
  双闪: [危险警告灯]

# 问法意图只补“要找哪类证据”，不注入答案。报警/故障问法不能被数值规格规则带偏。
intent_expansions:
  - when_any: [多少, 标准, 推荐, 合适, 参数]
    unless_any: [报警, 故障, 异常, 亮灯, 亮了, 充电, 充到]
    append: [参数]
  - when_any: [多久, 周期, 多长时间, 几年]
    require_any: [换, 更换]
    append: [时间, 里程, 更换]
  - when_any: [多久, 周期, 多长时间, 几年]
    require_any: [保养, 维护]
    append: [定期保养, 时间, 里程]
