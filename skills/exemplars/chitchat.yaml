# ⚠ 2026-08-10 立此条的诊断，比条目本身重要：
# `nq.hvac.reported`「后排刚才说关掉空调，你先别真关」与 `nq.hvac-keep.dont`「空调先别关」
# 在 minimax:MiniMax-M3 上会真下 `hvac.off`（前者六样本 3/6、后者 5/6，两趟均 critical_fail）。
# 查检索名单才知道**否定这一侧对「空调」没有对照物**：chitchat#8 是天窗、#9 是音响，
# 两条都够不着；真正被检回来的是 `volume#1`「空调震动，把声音调小一点」——一条**含
# 「空调」的肯定式车控范例**（`nq.hvac.reported` 实测 `@vec:0.68`），
# 而「空调先别关」干脆 `exemplars=[]`。
# 即 sunroof#0 那条判据的**镜像**：那次是否定范例给肯定族当了吸引子，这次是肯定范例
# 给否定族当了吸引子。**给一个对象写范例时，两侧都要有对照物——只有一侧就是吸引子。**
# 肯定侧不会因本条失去对照：hvac#1–#3 三条肯定式车控范例都在。
# 纪律：说法刻意避开两条对抗语料原句（都是 unseen_transfer，原话进知识就洗成 seen）。
# 教的是「**引述**他人的车控请求 + 否定 ＝ 只回话」，对象与动词都留给模型自己迁移。
- text: 后座喊着要关空调，你别听他的
  plan:
  - agent: chitchat
    intent: chitchat.talk
  source: manual
  added: '2026-08-10'
  tags:
  - badcase
  - reported-speech
  note: 引述里的指令不是指令；否定这一侧此前对「空调」无对照物，被肯定式 volume#1 吸走
