# 2026-08-02 泓舟裁定「找=发现 / 导航=出行」的载体（台账 nearby-navigation.find-vs-go）。
# 说法刻意避开对抗语料原句「我要加油」——把语料原句写成范例，那条 unseen 用例就变成
# seen，之后再读「通过率涨了」就读不出泛化（findings §4.3-2）。
- text: 油不多了，附近哪儿有加油站
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 加油站
  source: manual
  added: '2026-08-02'
  tags:
  - badcase
  note: 加油是需求不是动作——既不是开油箱盖，也不是直接发起导航
- text: 这边有地铁站吗
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 地铁站
  source: manual
  added: '2026-08-02'
  tags:
  - badcase
  note: 找/搜/有没有 归发现；导航去/带我去 才归 navigation
# ── 2026-08-04 补：充电的**对象不是车**时归周边发现 ────────────────────────
# 立卡来源 os.charge-place.phone（对抗语料 stable，A2 主体翻转）：「给手机找个能充电的
# 店」5 趟里 3 趟**产出空计划**——模型看得出这不是给车充电，但没有任何知识告诉它接下来
# 该干什么，于是什么都不做。对照组「给车找个充电的地方」5/5 落 charging.find。
# 判据：**charging 域的主体恒为车**；充电对象是手机/电脑/随身设备时，用户要的是一个
# 「能坐下充电的地方」，那是周边发现。
- text: 找个能给手机充电的咖啡馆
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 咖啡馆
  source: manual
  added: '2026-08-04'
  tags:
  - badcase
  note: 主体是手机不是车 → 不归 charging.find；charging 域的主体恒为车
# ── 2026-08-04 补：并列句里被取消的那半句**不产生任何 step** ────────────────
# 立卡来源 nq.dinner-music.drop-music（对抗语料 stable，A3 取消其一）：
# 「找家川菜馆，音乐就不用放了」5 趟里 2 趟产出 `nearby.search` + **`media.pause`**。
# `negation-and-deferral` policy 已经写着「不得规划 X 的反面」且**当轮确实注入了**
# （名单里 `full:negation-and-deferral`，没被裁）——所以这不是「知识没进上下文」，
# 是**进了没用对**：policy 的例子全是车控 open/close 对，媒体的「反面」长得不像反面
# （`pause` 读起来像「顺手收拾一下」而不是「做了被禁的那件事」）。
# 按 M5 分工，这一条投范例而不是往常驻 policy 里加字（policy 每次规划都付字符成本，
# 首版 506 字符就把 navigation-with-stop 挤成过 `!clipped`）。
# 2026-08-05 跨进程复验发现同域只注入一条：原文本词法分 0.4726，低于普通菜系
# `nearby#9` 的 0.4967，导致边界范例从未进入 prompt。保留 eid、不追加重复条目，
# 改用不同菜系和「先不用」的非同句表达；它对同一 case 的词法分 0.6899。
- text: 找家湘菜馆，音乐就先不用放了
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      cuisine: 湘菜
  source: manual
  added: '2026-08-04'
  tags:
  - badcase
  note: 被取消的那半句一个 step 都不出——不是 media.play，也不是 media.pause
# ── 2026-08-05 补：公共卫生设施仍是周边发现 ────────────────────────────────
# 立卡来源 os.toilet.nearby 的跨进程方差，但不复制对抗原句。已有「这边有地铁站吗」只教
# 交通设施，语义检索反而把「附近有洗手间吗」拉到 charging 的「附近有充电桩吗」；这里
# 用另一种设施名与问法示范通用的公共设施发现，不在核心路由层加设施词表。
- text: 这附近能找到公共厕所吗
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 公共厕所
  source: manual
  added: '2026-08-05'
  tags:
  - badcase
  note: 附近公共设施查询归 nearby.search，不归任何车辆状态能力
# ── 2026-08-13 补：品牌门店的**纯发现**句式（demo-mkemhn 3650e2b5）────────────
# 「查询附近的瑞幸咖啡」被 planner 两连拒后掉进 chitchat，兜底凭历史编造
# 「已为您找到 10 家门店，请选择其中一家」——无列表无卡片。纯门店发现归本域
# （README「纯门店发现继续放 nearby.yaml」）；带下单/菜单目标的组合句归 luckin.yaml。
- text: 查询附近的瑞幸咖啡
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      brand: 瑞幸
      keyword: 瑞幸咖啡
  source: trace
  added: '2026-08-13'
  tags:
  - badcase
  note: demo-mkemhn 3650e2b5——纯发现句被 chitchat 编造门店列表
# ── 2026-08-14 EVA 二轮批 E：语义类目 / 氛围属性 ─────────────────────────
- text: 带孩子去附近能看看动物的地方
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      category: 动物园
  source: manual
  added: '2026-08-14'
  tags:
  - canonical
  note: 口语目标→类目语义（看动物=动物园），发现面归 nearby，不逐字搜「看看动物的地方」
- text: 最近有点累，找个安静点的地方喝咖啡
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      category: 咖啡
  source: manual
  added: '2026-08-14'
  tags:
  - canonical
  note: 「安静」是氛围属性由能力侧软重排（标签+评分），不是目的地也不拆步
- text: 帮我找杯咖啡喝
  plan:
  - agent: nearby
    intent: nearby.search
    slots:
      keyword: 咖啡
  source: manual
  added: '2026-08-15'
  tags:
  - badcase
  note: 「找杯咖啡」是发现不是下单——真栈实测被派去 luckin.order，回了「数量需要是 1 到 20 之间的整数」槽校验错误当话术；点单要有明确品牌/门店语境（台账 nearby-luckin 族）
